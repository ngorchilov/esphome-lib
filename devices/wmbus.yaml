substitutions:
  name: wmbus
  friendly_name: wMBus Receiver

  # Board profile: lilygo or heltec
  board_profile: heltec

packages:
  - !include
    file: ../packages/appliances/lora-receiver.yaml
    vars:
      lora:
        board: ${board_profile}
        radio:
          driver: wmbus
        display:
          enabled: true

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_common, wmbus_meter, wmbus_radio]
    refresh: 0d

esp32:
  # ESPHome 2026.7 native ESP-IDF ignores the external component's .cc sources.
  toolchain: platformio

logger:
  level: INFO

wmbus_radio:
  - id: !extend lora_radio
    on_frame:
      - then:
        - lambda: |-
            id(wmbus_frame_count) += 1;
            id(wmbus_last_rssi) = frame->rssi();
            id(wmbus_last_len) = static_cast<uint16_t>(frame->data().size());
            id(wmbus_last_seen_ms) = millis();
        - logger.log:
            format: 'RSSI: %ddBm T: %s (%d)'
            args: [frame->rssi(), frame->as_hex().c_str(), frame->data().size()]
        - repeat:
            count: 3
            then:
              - output.turn_on: lora_status_led
              - delay: 100ms
              - output.turn_off: lora_status_led
              - delay: 100ms

globals:
  - id: oled_update_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wmbus_frame_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: wmbus_last_rssi
    type: int
    restore_value: no
    initial_value: '0'
  - id: wmbus_last_len
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: wmbus_last_seen_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

display:
  - id: !extend lora_display
    lambda: |-
      id(oled_update_count) += 1;
      it.print(0, 0, id(lora_oled_font), "wMBus Receiver");
      it.printf(0, 13, id(lora_oled_font), "Frames: %lu", (unsigned long) id(wmbus_frame_count));

      if (id(wmbus_last_seen_ms) == 0) {
        it.print(0, 26, id(lora_oled_font), "Last: waiting");
        it.print(0, 39, id(lora_oled_font), "RSSI: -- dBm");
        it.print(0, 52, id(lora_oled_font), "Alive: yes");
      } else {
        const uint32_t age_s = (millis() - id(wmbus_last_seen_ms)) / 1000;
        if (age_s < 1000) {
          it.printf(0, 26, id(lora_oled_font), "Last: %lus ago", (unsigned long) age_s);
        } else if (age_s < 3600) {
          it.printf(0, 26, id(lora_oled_font), "Last: %lum ago", (unsigned long) (age_s / 60));
        } else if (age_s < 86400) {
          it.printf(0, 26, id(lora_oled_font), "Last: %luh ago", (unsigned long) (age_s / 3600));
        } else {
          it.printf(0, 26, id(lora_oled_font), "Last: %lud ago", (unsigned long) (age_s / 86400));
        }
        it.printf(0, 39, id(lora_oled_font), "RSSI: %d dBm", id(wmbus_last_rssi));
        it.printf(0, 52, id(lora_oled_font), "Len:%uB", id(wmbus_last_len));
      }


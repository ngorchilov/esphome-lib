# Tuya MT-29 15-in-1 Air Quality Monitor (T1-U-HL)

substitutions:
  name: tuya-air-quality-mt29
  friendly_name: Tuya MT-29 Air Quality Monitor

packages:
  - !include ../packages/boards/tuya/t1u.yaml
  - !include ../packages/modules/tuya-product.yaml

logger:
  level: DEBUG

uart:
  id: tuya_uart
  tx_pin: TX1
  rx_pin: RX1
  baud_rate: 115200

tuya:
  id: mt29_tuya
  uart_id: tuya_uart
  time_id: ha_time
  on_datapoint_update:
    # The Things Data Model exposes only this three-level category, while the
    # product display also shows a numeric AQI whose datapoint is not documented.
    # TODO: If the MCU does not report a numeric AQI on an undocumented datapoint,
    # choose an AQI standard and implement a clearly labelled derived value.
    - sensor_datapoint: 1
      datapoint_type: enum
      then:
        - lambda: |-
            static const char *const LEVELS[] = {"Excellent", "Good", "Poor"};
            if (x < 3) {
              id(mt29_air_quality).publish_state(LEVELS[x]);
            } else {
              id(mt29_air_quality).publish_state(std::string("Unknown (") + std::to_string(x) + ")");
            }

sensor:
  - platform: tuya
    tuya_id: mt29_tuya
    name: Temperature
    sensor_datapoint: 2
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: Humidity
    sensor_datapoint: 3
    unit_of_measurement: '%'
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: Carbon Dioxide
    sensor_datapoint: 4
    unit_of_measurement: ppm
    device_class: carbon_dioxide
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: Formaldehyde
    sensor_datapoint: 5
    unit_of_measurement: mg/m³
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: tuya
    tuya_id: mt29_tuya
    name: PM2.5
    sensor_datapoint: 7
    unit_of_measurement: µg/m³
    device_class: pm25
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: PM1.0
    sensor_datapoint: 8
    unit_of_measurement: µg/m³
    device_class: pm1
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: PM10
    sensor_datapoint: 9
    unit_of_measurement: µg/m³
    device_class: pm10
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: Battery Level
    sensor_datapoint: 22
    unit_of_measurement: '%'
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: tuya
    tuya_id: mt29_tuya
    name: TVOC
    sensor_datapoint: 101
    unit_of_measurement: mg/m³
    device_class: volatile_organic_compounds
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: tuya
    tuya_id: mt29_tuya
    name: Carbon Monoxide
    sensor_datapoint: 102
    unit_of_measurement: ppm
    device_class: carbon_monoxide
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    tuya_id: mt29_tuya
    name: PM0.3
    sensor_datapoint: 107
    unit_of_measurement: µg/m³
    state_class: measurement
    accuracy_decimals: 0

binary_sensor:
  - platform: tuya
    tuya_id: mt29_tuya
    name: Charging
    sensor_datapoint: 23
    device_class: battery_charging
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: Air Quality
    id: mt29_air_quality
    icon: mdi:air-filter

select:
  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm Volume
    enum_datapoint: 28
    entity_category: config
    options:
      0: Low
      1: Medium
      2: High
      3: Mute

  - platform: tuya
    tuya_id: mt29_tuya
    name: Display Brightness
    enum_datapoint: 103
    entity_category: config
    options:
      0: Level 1
      1: Level 2
      2: Level 3
      3: Level 4

  - platform: tuya
    tuya_id: mt29_tuya
    name: Temperature Unit
    enum_datapoint: 112
    entity_category: config
    options:
      0: Celsius
      1: Fahrenheit

switch:
  - platform: tuya
    tuya_id: mt29_tuya
    name: Sound
    switch_datapoint: 106
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm 1 Enabled
    switch_datapoint: 116
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm 2 Enabled
    switch_datapoint: 117
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm 3 Enabled
    switch_datapoint: 118
    entity_category: config

number:
  - platform: tuya
    tuya_id: mt29_tuya
    name: Carbon Dioxide Alarm Threshold
    number_datapoint: 104
    unit_of_measurement: ppm
    min_value: 500
    max_value: 3000
    step: 100
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Screen Sleep Time
    number_datapoint: 105
    unit_of_measurement: min
    device_class: duration
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Timer
    number_datapoint: 108
    unit_of_measurement: min
    device_class: duration
    min_value: 1
    max_value: 599
    step: 1
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm 1 Time
    number_datapoint: 109
    unit_of_measurement: min
    device_class: duration
    min_value: 0
    max_value: 1440
    step: 1
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm 2 Time
    number_datapoint: 110
    unit_of_measurement: min
    device_class: duration
    min_value: 0
    max_value: 1440
    step: 1
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Alarm 3 Time
    number_datapoint: 111
    unit_of_measurement: min
    device_class: duration
    min_value: 0
    max_value: 1440
    step: 1
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Carbon Monoxide Alarm Threshold
    number_datapoint: 113
    unit_of_measurement: ppm
    min_value: 10
    max_value: 500
    step: 10
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: PM2.5 Alarm Threshold
    number_datapoint: 114
    unit_of_measurement: µg/m³
    min_value: 50
    max_value: 300
    step: 10
    mode: box
    entity_category: config

  - platform: tuya
    tuya_id: mt29_tuya
    name: Formaldehyde Alarm Threshold
    number_datapoint: 115
    unit_of_measurement: mg/m³
    min_value: 0.08
    max_value: 1.99
    step: 0.01
    multiply: 100
    mode: box
    entity_category: config

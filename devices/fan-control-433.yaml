substitutions:
  # Device identity
  name: fan-control-433
  friendly_name: Fan Control 433

  # RF backend selection: sx127x or cc1101
  radio: sx127x
  rf_frequency: 433.92MHz

  # Fan protocol timings and commands
  fan_short_us: 400
  fan_long_us: 1200
  fan_gap_us: 11900
  fan_repeat_count: 4

  fan_cmd_on: 0x0A
  fan_cmd_off: 0x0D
  fan_cmd_out_plus: 0x0B
  fan_cmd_out_minus: 0x0C
  fan_cmd_in_plus: 0x0E
  fan_cmd_in_minus: 0x0F

  # Fan state model and command sequencing
  fan_speed_count: 6
  fan_restore_mode: RESTORE_DEFAULT_OFF
  fan_direction_out: FORWARD
  fan_direction_in: REVERSE
  fan_command_pause: 100ms
  fan_sync_direction: out # out | in
  fan_sync_endpoint: min # min | max
  fan_sync_saturation_count: 6

  # Package API: fan433.fans accepts RF addresses or address/name/id mappings.
  fan433_instances: |-
    <% set fans = (fan433 | default({})).get("fans", []) %>
    <% set result = [] %>
    <% for fan in fans %>
      <% set address = fan.get("address") if fan is mapping else fan %>
      <% set default_name = "Fan %04X" | format(address) %>
      <% set default_id = "fan_%04x" | format(address) %>
      <% set fan_name = fan.get("name", default_name) if fan is mapping else default_name %>
      <% set fan_id = fan.get("id", default_id) if fan is mapping else default_id %>
      <% do result.append({"address": address, "name": fan_name, "id": fan_id}) %>
    <% endfor %>
    ${ result }

  fan433_entities: |-
    <% set result = [] %>
    <% for fan in fan433_instances %>
      <% set code = [] %>
      <% do code.append("const uint16_t address = 0x%04X;" | format(fan["address"])) %>
      <% do code.append("auto &states = id(fan433_assumed_states);") %>
      <% do code.append("auto state_it = std::find_if(states.begin(), states.end(), [address](uint32_t value) { return (value >> 8) == address; });") %>
      <% do code.append("if (state_it == states.end()) return;") %>
      <% do code.append("const uint8_t assumed = static_cast<uint8_t>(*state_it & 0xFF);") %>
      <% do code.append("const bool physical_on = (assumed & 0x80) != 0;") %>
      <% do code.append("const bool physical_out = (assumed & 0x40) == 0;") %>
      <% do code.append("const int physical_speed = std::max(1, std::min(" ~ fan_speed_count ~ ", static_cast<int>(assumed & 0x0F)));") %>
      <% do code.append("const bool target_on = id(" ~ fan["id"] ~ ").state;") %>
      <% do code.append("const bool target_out = id(" ~ fan["id"] ~ ").direction == fan::FanDirection::" ~ fan_direction_out ~ ";") %>
      <% do code.append("const int target_speed = std::max(1, std::min(" ~ fan_speed_count ~ ", id(" ~ fan["id"] ~ ").speed));") %>
      <% do code.append("auto enqueue = [address](uint8_t command) { id(fan433_command_queue).push_back((static_cast<uint32_t>(address) << 8) | command); };") %>
      <% do code.append("if (!target_on) {") %>
      <% do code.append("  if (physical_on) enqueue(" ~ fan_cmd_off ~ ");") %>
      <% do code.append("  *state_it = (static_cast<uint32_t>(address) << 8) | (assumed & 0x7F);") %>
      <% do code.append("  return;") %>
      <% do code.append("}") %>
      <% do code.append("if (!physical_on) enqueue(" ~ fan_cmd_on ~ ");") %>
      <% do code.append("const uint8_t plus_command = target_out ? " ~ fan_cmd_out_plus ~ " : " ~ fan_cmd_in_plus ~ ";") %>
      <% do code.append("const uint8_t minus_command = target_out ? " ~ fan_cmd_out_minus ~ " : " ~ fan_cmd_in_minus ~ ";") %>
      <% do code.append("if (target_speed > physical_speed) {") %>
      <% do code.append("  for (int i = physical_speed; i < target_speed; i++) enqueue(plus_command);") %>
      <% do code.append("} else if (target_speed < physical_speed) {") %>
      <% do code.append("  for (int i = physical_speed; i > target_speed; i--) enqueue(minus_command);") %>
      <% do code.append("} else if (target_out != physical_out) {") %>
      <% do code.append("  if (target_speed == 1) enqueue(minus_command);") %>
      <% do code.append("  else if (target_speed == " ~ fan_speed_count ~ ") enqueue(plus_command);") %>
      <% do code.append("  else { enqueue(plus_command); enqueue(minus_command); }") %>
      <% do code.append("}") %>
      <% do code.append("const uint8_t next = 0x80 | (target_out ? 0x00 : 0x40) | target_speed;") %>
      <% do code.append("*state_it = (static_cast<uint32_t>(address) << 8) | next;") %>
      <% do result.append({
        "platform": "template",
        "name": fan["name"],
        "id": fan["id"],
        "speed_count": fan_speed_count,
        "has_direction": true,
        "restore_mode": fan_restore_mode,
        "on_state": [{
          "if": {
            "condition": {"lambda": "return id(fan433_ready);"},
            "then": [
              {"lambda": code | join("\n")},
              {"if": {
                "condition": {"lambda": "return !id(fan433_command_queue).empty() && !id(fan433_transmit_active);"},
                "then": [{"script.execute": {"id": "fan433_transmit_queue"}}]
              }}
            ]
          }
        }]
      }) %>
    <% endfor %>
    ${ result }

  fan433_sync_buttons: |-
    <% set sync_out = fan_sync_direction == "out" %>
    <% set sync_min = fan_sync_endpoint == "min" %>
    <% set sync_speed = 1 if sync_min else fan_speed_count %>
    <% set sync_command = fan_cmd_out_minus if sync_out and sync_min else fan_cmd_out_plus if sync_out else fan_cmd_in_minus if sync_min else fan_cmd_in_plus %>
    <% set result = [] %>
    <% for fan in fan433_instances %>
      <% set code = [] %>
      <% do code.append("const uint16_t address = 0x%04X;" | format(fan["address"])) %>
      <% do code.append("const bool target_on = id(" ~ fan["id"] ~ ").state;") %>
      <% do code.append("const bool target_out = id(" ~ fan["id"] ~ ").direction == fan::FanDirection::" ~ fan_direction_out ~ ";") %>
      <% do code.append("const int target_speed = std::max(1, std::min(" ~ fan_speed_count ~ ", id(" ~ fan["id"] ~ ").speed));") %>
      <% do code.append("auto enqueue = [address](uint8_t command) { id(fan433_command_queue).push_back((static_cast<uint32_t>(address) << 8) | command); };") %>
      <% do code.append("enqueue(" ~ fan_cmd_on ~ ");") %>
      <% do code.append("for (int i = 0; i < " ~ fan_sync_saturation_count ~ "; i++) enqueue(" ~ sync_command ~ ");") %>
      <% do code.append("const bool anchor_out = " ~ ("true" if sync_out else "false") ~ ";") %>
      <% do code.append("const int anchor_speed = " ~ sync_speed ~ ";") %>
      <% do code.append("const uint8_t plus_command = target_out ? " ~ fan_cmd_out_plus ~ " : " ~ fan_cmd_in_plus ~ ";") %>
      <% do code.append("const uint8_t minus_command = target_out ? " ~ fan_cmd_out_minus ~ " : " ~ fan_cmd_in_minus ~ ";") %>
      <% do code.append("if (target_speed > anchor_speed) {") %>
      <% do code.append("  for (int i = anchor_speed; i < target_speed; i++) enqueue(plus_command);") %>
      <% do code.append("} else if (target_speed < anchor_speed) {") %>
      <% do code.append("  for (int i = anchor_speed; i > target_speed; i--) enqueue(minus_command);") %>
      <% do code.append("} else if (target_out != anchor_out) {") %>
      <% do code.append("  if (target_speed == 1) enqueue(minus_command);") %>
      <% do code.append("  else if (target_speed == " ~ fan_speed_count ~ ") enqueue(plus_command);") %>
      <% do code.append("  else { enqueue(plus_command); enqueue(minus_command); }") %>
      <% do code.append("}") %>
      <% do code.append("if (!target_on) enqueue(" ~ fan_cmd_off ~ ");") %>
      <% do code.append("const uint8_t next = (target_on ? 0x80 : 0x00) | (target_out ? 0x00 : 0x40) | target_speed;") %>
      <% do code.append("auto &states = id(fan433_assumed_states);") %>
      <% do code.append("auto state_it = std::find_if(states.begin(), states.end(), [address](uint32_t value) { return (value >> 8) == address; });") %>
      <% do code.append("const uint32_t packed = (static_cast<uint32_t>(address) << 8) | next;") %>
      <% do code.append("if (state_it == states.end()) states.push_back(packed); else *state_it = packed;") %>
      <% do result.append({
        "platform": "template",
        "name": fan["name"] ~ " Synchronize",
        "id": fan["id"] ~ "_synchronize",
        "icon": "mdi:sync",
        "entity_category": "config",
        "on_press": [
          {"lambda": code | join("\n")},
          {"if": {
            "condition": {"lambda": "return !id(fan433_command_queue).empty() && !id(fan433_transmit_active);"},
            "then": [{"script.execute": {"id": "fan433_transmit_queue"}}]
          }}
        ]
      }) %>
    <% endfor %>
    ${ result }

  fan433_state_initializers: |-
    static_assert(fan::FanDirection::${fan_direction_out} != fan::FanDirection::${fan_direction_in});
    id(fan433_assumed_states).clear();
    <% for fan in fan433_instances %>
    {
      const uint16_t address = 0x${ "%04X" | format(fan["address"]) };
      const int speed = std::max(1, std::min(${fan_speed_count}, id(${fan["id"]}).speed));
      const bool is_out = id(${fan["id"]}).direction == fan::FanDirection::${fan_direction_out};
      const uint8_t state = (id(${fan["id"]}).state ? 0x80 : 0x00) | (is_out ? 0x00 : 0x40) | speed;
      id(fan433_assumed_states).push_back((static_cast<uint32_t>(address) << 8) | state);
    }
    <% endfor %>
    id(fan433_ready) = true;

  # RF learning window
  rf_learn_window_ms: 30000
  rf_learn_window_s: 30

  # ESP-IDF advanced options per backend
  framework_advanced_sx127x:
    sram1_as_iram: true
  framework_advanced_cc1101:
    minimum_chip_revision: 3.1
    sram1_as_iram: true

  # SX127x pins: LilyGO TTGO LoRa32 V2.1
  clk_pin_sx127x:
    number: GPIO5
    ignore_strapping_warning: true
  mosi_pin_sx127x: GPIO27
  miso_pin_sx127x: GPIO19
  cs_pin_sx127x: GPIO18
  rst_pin_sx127x: GPIO23
  tx_pin_sx127x:
    number: GPIO32 # SX1278 DIO2, raw TX data in OOK continuous mode
    allow_other_uses: true
  rx_pin_sx127x:
    number: GPIO32 # SX1278 DIO2, raw RX data out OOK continuous mode
    allow_other_uses: true

  # CC1101 pins: ESP32-WROOM-32 DevKit, VSPI + GDO0/GDO2
  clk_pin_cc1101: GPIO18 # CC1101 pin 5: SCK (white)
  mosi_pin_cc1101: GPIO23 # CC1101 pin 6: MOSI (yellow)
  miso_pin_cc1101: GPIO19 # CC1101 pin 7: MISO (blue)
  cs_pin_cc1101:
    number: GPIO5 # CC1101 pin 4: CSN (green)
    ignore_strapping_warning: true
  gdo0_pin_cc1101: GPIO26 # CC1101 pin 3: GDO0, TX data in (brown)
  gdo2_pin_cc1101: GPIO25 # CC1101 pin 8: GDO2, RX data out (orange)
  tx_pin_cc1101:
    number: ${gdo0_pin_cc1101} # CC1101 GDO0, TX data in
  rx_pin_cc1101:
    number: ${gdo2_pin_cc1101} # CC1101 GDO2, RX data out

  # Radio component fragments
  components_sx127x:
    sx127x:
      id: rf_radio
      cs_pin: ${cs_pin_sx127x}
      rst_pin: ${rst_pin_sx127x}
      bandwidth: 50_0kHz
      frequency: ${rf_frequency}
      modulation: OOK
      bitsync: false
      packet_mode: false
      rx_start: false
      pa_pin: BOOST
      pa_power: 17

  components_cc1101:
    cc1101:
      id: rf_radio
      cs_pin: ${cs_pin_cc1101}
      frequency: ${rf_frequency}
      modulation_type: ASK/OOK
      packet_mode: false
      output_power: 10

  # TX mode hooks per backend
  tx_hooks_sx127x:
    on_transmit:
      then:
        - sx127x.set_mode_tx:
    on_complete:
      then:
        - sx127x.set_mode_standby:

  tx_hooks_cc1101:
    on_transmit:
      then:
        - logger.log:
            level: DEBUG
            format: 'fan433: CC1101 begin_tx'
        - cc1101.begin_tx:
            id: rf_radio
        - logger.log:
            level: DEBUG
            format: 'fan433: RMT transmit started'
    on_complete:
      then:
        - logger.log:
            level: DEBUG
            format: 'fan433: RF transmit complete'
        # Return the CC1101 to RX/idle-ready mode after transmission.
        - cc1101.begin_rx:
            id: rf_radio

  fan433_tx_complete_actions:
    - lambda: |-
        auto &queue = id(fan433_command_queue);
        if (!queue.empty()) {
          queue.erase(queue.begin());
        }
    - delay: ${fan_command_pause}
    - lambda: id(fan433_transmit_active) = false;
    - if:
        condition:
          lambda: return !id(fan433_command_queue).empty();
        then:
          - script.execute: fan433_transmit_queue

  # RX mode hooks per backend
  rx_enter_action_sx127x:
    sx127x.set_mode_rx:
  rx_enter_action_cc1101:
    cc1101.begin_rx:
      id: rf_radio

packages:
  - !include
    file: fan-control-433/board.yaml
    vars:
      fan433_board:
        radio: ${radio}
      esp32_advanced: ${ framework_advanced_${radio} }
  # Inject either sx127x: or cc1101: at top level.
  - ${ components_${radio} }
  # Generate one fan entity and synchronization button per RF address.
  - fan: ${ fan433_entities }
    button: ${ fan433_sync_buttons }

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            ${fan433_state_initializers}

logger:
  level: DEBUG

spi:
  clk_pin: ${clk_pin_${radio}}
  mosi_pin: ${mosi_pin_${radio}}
  miso_pin: ${miso_pin_${radio}}

remote_transmitter:
  id: rf_tx
  pin: ${tx_pin_${radio}}
  carrier_duty_percent: 100%
  non_blocking: true
  # ESP-IDF requires at least 64 RMT symbols on ESP32.
  rmt_symbols: 64
  on_transmit: ${tx_hooks_${radio}.on_transmit}
  on_complete:
    then: ${ tx_hooks_${radio}.on_complete.then + fan433_tx_complete_actions }

remote_receiver:
  id: rf_rx
  pin: ${rx_pin_${radio}}
  # Keep ESPHome's built-in raw dumper disabled; otherwise normal RF noise
  # spams the logs even when learn mode is not active. Our on_raw lambda below
  # decides what to log/publish during the explicit learn window.
  dump: []
  tolerance: 35%
  filter: 200us
  idle: 9000us
  on_raw:
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (!id(rf_learn_active)) {
            return;
          }

          if (static_cast<int32_t>(now - id(rf_learn_until_ms)) > 0) {
            id(rf_learn_active) = false;
            id(rf_last_status).publish_state("Learn timeout");
            ESP_LOGI("fan433", "RF learn timeout");
            return;
          }

          ESP_LOGV("fan433", "RF raw received: pulses=%u", static_cast<unsigned>(x.size()));

          std::string raw;
          raw.reserve(220);
          const size_t shown = std::min<size_t>(x.size(), 48);
          for (size_t i = 0; i < shown; i++) {
            char value[18];
            snprintf(value, sizeof(value), "%ld", static_cast<long>(x[i]));
            if (!raw.empty()) {
              raw += ", ";
            }
            raw += value;
          }
          if (x.size() > shown) {
            raw += ", ...";
          }
          id(rf_last_raw).publish_state(raw);

          auto near_us = [](int32_t value, uint16_t target, uint16_t tolerance) -> bool {
            const int32_t abs_value = value < 0 ? -value : value;
            return abs_value >= static_cast<int32_t>(target - tolerance) &&
                   abs_value <= static_cast<int32_t>(target + tolerance);
          };

          auto command_name = [](uint8_t cmd) -> const char * {
            switch (cmd) {
              case ${fan_cmd_on}: return "ON";
              case ${fan_cmd_off}: return "OFF";
              case ${fan_cmd_out_plus}: return "OUT+";
              case ${fan_cmd_out_minus}: return "OUT-";
              case ${fan_cmd_in_plus}: return "IN+";
              case ${fan_cmd_in_minus}: return "IN-";
              default: return "unknown";
            }
          };

          bool found = false;
          uint32_t found_frame = 0;
          uint16_t found_address = 0;
          uint8_t found_command = 0;
          size_t found_offset = 0;

          // Try to decode this family protocol anywhere in the raw capture:
          // 32 bits, MSB first, 0=short/long, 1=long/short, then cmd + ~cmd.
          for (size_t start = 0; start + 63 < x.size() && !found; start++) {
            uint32_t frame = 0;
            bool ok = true;

            for (int bit = 0; bit < 32; bit++) {
              const int32_t high = static_cast<int32_t>(x[start + bit * 2]);
              const int32_t low = static_cast<int32_t>(x[start + bit * 2 + 1]);

              if (high <= 0 || low >= 0) {
                ok = false;
                break;
              }

              frame <<= 1;
              if (near_us(high, ${fan_short_us}, 250) && near_us(low, ${fan_long_us}, 350)) {
                // bit 0
              } else if (near_us(high, ${fan_long_us}, 350) && near_us(low, ${fan_short_us}, 250)) {
                frame |= 1;
              } else {
                ok = false;
                break;
              }
            }

            if (!ok) {
              continue;
            }

            const uint8_t cmd = static_cast<uint8_t>((frame >> 8) & 0xFF);
            const uint8_t inv = static_cast<uint8_t>(frame & 0xFF);
            if (static_cast<uint8_t>(cmd ^ inv) != 0xFF) {
              continue;
            }

            found = true;
            found_frame = frame;
            found_address = static_cast<uint16_t>((frame >> 16) & 0xFFFF);
            found_command = cmd;
            found_offset = start;
          }

          if (!found) {
            ESP_LOGV("fan433", "RF raw received but no valid fan-family frame decoded");
            return;
          }

          char frame_text[80];
          snprintf(frame_text, sizeof(frame_text), "0x%08lX", static_cast<unsigned long>(found_frame));
          id(rf_last_frame).publish_state(frame_text);

          char address_text[80];
          snprintf(address_text, sizeof(address_text), "0x%04X", static_cast<unsigned>(found_address));
          id(rf_last_address).publish_state(address_text);

          char command_text[80];
          snprintf(command_text, sizeof(command_text), "0x%02X %s", static_cast<unsigned>(found_command), command_name(found_command));
          id(rf_last_command).publish_state(command_text);

          char status_text[120];
          snprintf(status_text, sizeof(status_text), "Decoded fan frame at pulse %u", static_cast<unsigned>(found_offset));
          id(rf_last_status).publish_state(status_text);
          id(rf_learn_active) = false;

          ESP_LOGV("fan433", "learned frame=0x%08lX address=0x%04X command=0x%02X (%s) offset=%u pulses=%u",
                   static_cast<unsigned long>(found_frame),
                   static_cast<unsigned>(found_address),
                   static_cast<unsigned>(found_command),
                   command_name(found_command),
                   static_cast<unsigned>(found_offset),
                   static_cast<unsigned>(x.size()));

globals:
  - id: fan433_ready
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: fan433_assumed_states
    type: std::vector<uint32_t>
    restore_value: no
    initial_value: 'std::vector<uint32_t>{}'
  - id: fan433_command_queue
    type: std::vector<uint32_t>
    restore_value: no
    initial_value: 'std::vector<uint32_t>{}'
  - id: fan433_transmit_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: rf_learn_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: rf_learn_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

text_sensor:
  - platform: template
    id: rf_last_status
    name: RF Last Status
    update_interval: never
  - platform: template
    id: rf_last_frame
    name: RF Last Frame
    update_interval: never
  - platform: template
    id: rf_last_address
    name: RF Last Address
    update_interval: never
  - platform: template
    id: rf_last_command
    name: RF Last Command
    update_interval: never
  - platform: template
    id: rf_last_raw
    name: RF Last Raw
    internal: true
    update_interval: never

button:
  - platform: template
    name: Learn RF Remote
    icon: mdi:radio-tower
    on_press:
      - logger.log:
          level: DEBUG
          format: 'fan433: learn mode enabled for ${rf_learn_window_s} seconds; press one original remote button now'
      - lambda: |-
          id(rf_learn_active) = true;
          id(rf_learn_until_ms) = millis() + ${rf_learn_window_ms};
          id(rf_last_status).publish_state("Learning for ${rf_learn_window_s} seconds");
          id(rf_last_frame).publish_state("Unknown");
          id(rf_last_address).publish_state("Unknown");
          id(rf_last_command).publish_state("Unknown");
          id(rf_last_raw).publish_state("Unknown");
      - ${rx_enter_action_${radio}}

script:
  - id: fan433_transmit_queue
    mode: single
    then:
      - if:
          condition:
            lambda: return !id(fan433_command_queue).empty() && !id(fan433_transmit_active);
          then:
            - lambda: |-
                id(fan433_transmit_active) = true;
                const uint32_t queued = id(fan433_command_queue).front();
                ESP_LOGI("fan433", "transmit command=0x%02X address=0x%04X repeat=%u",
                         static_cast<unsigned>(queued & 0xFF),
                         static_cast<unsigned>((queued >> 8) & 0xFFFF),
                         static_cast<unsigned>(${fan_repeat_count}));
            - remote_transmitter.transmit_raw:
                transmitter_id: rf_tx
                code: !lambda |-
                  // -----------------------------------------------------------
                  // Decoded bathroom fan RF protocol.
                  //
                  // Frame format, MSB first:
                  //   16-bit address + 8-bit command + 8-bit inverse(command)
                  //
                  // Pulse encoding:
                  //   bit 0 = short HIGH + long LOW
                  //   bit 1 = long HIGH  + short LOW
                  // -----------------------------------------------------------
                  const uint16_t short_us = ${fan_short_us};
                  const uint16_t long_us = ${fan_long_us};
                  const uint16_t gap_us = ${fan_gap_us};

                  const uint32_t queued = id(fan433_command_queue).front();
                  const uint16_t address = static_cast<uint16_t>((queued >> 8) & 0xFFFF);
                  const uint8_t cmd = static_cast<uint8_t>(queued & 0xFF);
                  const uint8_t inv = static_cast<uint8_t>(~cmd);
                  const uint32_t frame = (static_cast<uint32_t>(address) << 16) |
                                         (static_cast<uint32_t>(cmd) << 8) |
                                         inv;

                  std::vector<long> pulses;
                  pulses.reserve(65);
                  for (int bit = 31; bit >= 0; bit--) {
                    if (frame & (1UL << bit)) {
                      pulses.push_back(long_us);
                      pulses.push_back(-short_us);
                    } else {
                      pulses.push_back(short_us);
                      pulses.push_back(-long_us);
                    }
                  }
                  pulses.push_back(short_us);

                  ESP_LOGV("fan433", "raw frame=0x%08X pulses=%u short=%u long=%u gap=%u",
                           static_cast<unsigned>(frame),
                           static_cast<unsigned>(pulses.size()),
                           static_cast<unsigned>(short_us),
                           static_cast<unsigned>(long_us),
                           static_cast<unsigned>(gap_us));
                  return pulses;
                repeat:
                  times: ${fan_repeat_count}
                  wait_time: ${fan_gap_us}us

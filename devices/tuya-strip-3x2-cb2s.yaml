substitutions:
  name: tuya-strip-3x2-cb2s
  friendly_name: Tuya Strip 3x2 (CB2S)

  led_pin: GPIO10
  led_inverted: 'true'

  button_pin: GPIO11
  button_pullup: 'true'
  button_inverted: 'true'

  relay1_pin: GPIO6
  relay1_inverted: 'false'
  relay1_id: socket_1_2
  relay1_name: Socket 1&2

  relay2_pin: GPIO7
  relay2_inverted: 'false'
  relay2_id: socket_3_4
  relay2_name: Socket 3&4

  relay3_pin: GPIO8
  relay3_inverted: 'false'
  relay3_id: socket_5_6
  relay3_name: Socket 5&6

  relay4_pin: GPIO26
  relay4_inverted: 'false'
  relay4_id: relay_usb
  relay4_name: Relay USB

packages:
  - !include ../packages/boards/tuya/cb2s.yaml
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay1_id}
        entity:
          type: switch
          name: ${relay1_name}
        power:
          pin: ${relay1_pin}
          inverted: ${relay1_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay1_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay2_id}
        entity:
          type: switch
          name: ${relay2_name}
        power:
          pin: ${relay2_pin}
          inverted: ${relay2_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay2_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay3_id}
        entity:
          type: switch
          name: ${relay3_name}
        power:
          pin: ${relay3_pin}
          inverted: ${relay3_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay3_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay4_id}
        entity:
          type: switch
          name: ${relay4_name}
        power:
          pin: ${relay4_pin}
          inverted: ${relay4_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay4_name}

esphome:
  on_boot:
    - if:
        condition:
          binary_sensor.is_on: power_status
        then:
          - light.turn_on: status_led
        else:
          - light.turn_off: status_led

web_server:
  version: 3

output:
  - platform: gpio
    id: led_output
    pin: ${led_pin}
    inverted: ${led_inverted}

light:
  - platform: binary
    id: status_led
    output: led_output

binary_sensor:
  - platform: template
    id: power_status
    name: Power Status
    lambda: |-
      return id(${relay1_id}_power_relay).state || id(${relay2_id}_power_relay).state ||
             id(${relay3_id}_power_relay).state || id(${relay4_id}_power_relay).state;
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: power_status
            then:
              - light.turn_on: status_led
            else:
              - light.turn_off: status_led

  - platform: gpio
    name: Button
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: ${button_pullup}
      inverted: ${button_inverted}
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: power_status
            then:
              - switch.turn_off: ${relay1_id}_power_relay
              - switch.turn_off: ${relay2_id}_power_relay
              - switch.turn_off: ${relay3_id}_power_relay
              - switch.turn_off: ${relay4_id}_power_relay
            else:
              - switch.turn_on: ${relay1_id}_power_relay
              - switch.turn_on: ${relay2_id}_power_relay
              - switch.turn_on: ${relay3_id}_power_relay
              - switch.turn_on: ${relay4_id}_power_relay

button:
  - platform: template
    name: Reboot All Relays
    on_press:
      - script.execute: ${relay1_id}_power_cycle
      - script.execute: ${relay2_id}_power_cycle
      - script.execute: ${relay3_id}_power_cycle
      - script.execute: ${relay4_id}_power_cycle

substitutions:
  name: tuya-ceiling-light-wl2h
  friendly_name: Tuya Ceiling Light (WL2H)

packages:
  - !include ../packages/boards/tuya/wl2h.yaml

external_components:
  - source: !include ../packages/component-source.yaml
    components: [ln882h_pwm]
    refresh: 0s

output:
  - platform: ln882h_pwm
    id: out_red
    pin: PA07
    timer: 0
    frequency: 4000 Hz

  - platform: ln882h_pwm
    id: out_green
    pin: PA10
    timer: 1
    frequency: 4000 Hz

  - platform: ln882h_pwm
    id: out_blue
    pin: PA11
    timer: 2
    frequency: 4000 Hz

  # White endpoints inferred from stock code; confirm the emitted colors on hardware.
  - platform: ln882h_pwm
    id: out_cold
    pin: PA12
    timer: 3
    frequency: 4000 Hz

  - platform: ln882h_pwm
    id: out_warm
    pin: PB03
    timer: 4
    frequency: 4000 Hz

light:
  - platform: rgbww
    name: None
    id: main_light
    red: out_red
    green: out_green
    blue: out_blue
    warm_white: out_warm
    cold_white: out_cold
    # Match the CBU variant's UI range until this revision is measured.
    warm_white_color_temperature: 2700 K
    cold_white_color_temperature: 6500 K
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 200ms
    gamma_correct: 2.2
    color_interlock: true
    # Stock white mixing shares one channel's power across both outputs.
    constant_brightness: true

substitutions:
  name: tuya-garage-opener
  friendly_name: Tuya Garage Opener
  ble_enabled: ${ (ble | default({})).get("enabled", false) }
  ble_name_add_mac_suffix: ${ (ble | default({})).get("name_add_mac_suffix", false) }
  # BT Inspector's separate Shortcut actions need the previous BLE connection released.
  ble_connection_timeout: ${ (ble | default({})).get("connection_timeout", "5s") }
  # BDK 3.0.78 limits the BLE device name to 17 bytes.
  ble_name: >-
    ${ (ble | default({})).get("name",
       friendly_name[:10 if (ble_name_add_mac_suffix | string | lower) in
       ["true", "yes", "on", "enable"] else 17].rstrip()) }
  led_pin: GPIO6
  button_pin: GPIO7
  relay_pin: GPIO8
  magnetic_pin: GPIO26
  magnetic_contact_delay: 0.5s # delay for magnetic sensor stabilization
  pulse_duration: 0.2s
  door_travel_time: 30 # Seconds; adjustable through Door Travel Time.

packages:
  - !include ../packages/boards/tuya/cbu.yaml
  # Load the garage command secret only in the enabled package.
  - !include
    file: ../packages/modules/${ 'tuya-garage-opener-ble' if (ble_enabled | string | lower) == 'true' else 'bk72xx-ble-pulse' }.yaml
    vars:
      ble_pulse:
        enabled: ${ble_enabled}

number:
  - platform: template
    name: Door Travel Time
    id: door_travel_time_sensor
    mode: box
    entity_category: config
    min_value: 5
    max_value: 60
    step: 1
    initial_value: ${door_travel_time}
    restore_value: true
    optimistic: true
    unit_of_measurement: s

output:
  - id: relay_output
    platform: gpio
    pin: ${relay_pin}
  - id: led_output
    platform: gpio
    pin: ${led_pin}
    inverted: true

light:
  - platform: binary
    id: garage_door_led
    output: led_output
    internal: true

script:
  - id: toggle_door
    then:
      - cover.toggle: garage_door

  - id: pulse_relay
    then:
      - output.turn_on: relay_output
      - light.turn_on: garage_door_led
      - delay: ${pulse_duration}
      - output.turn_off: relay_output
      - light.turn_off: garage_door_led

globals:
  # Timestamp (in milliseconds) when a cover operation started.
  - id: op_start
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # A single closed contact cannot prove an open endpoint. Never restore this estimate.
  - id: garage_open_estimated
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: garage_unknown_motion
    type: bool
    restore_value: no
    initial_value: 'false'

# The contact proves CLOSED only; OPEN is estimated after Door Travel Time.
# OPEN commands require the closed contact; CLOSE requires a completed opening estimate.
# Restart away from the contact or an unconfirmed close inhibits direction commands.
# Explicit TOGGLE remains available from unknown positions: observe the door when using it.
# Commands during movement/pulses are ignored; unknown toggles also block BLE recovery reboots
# until the contact closes or travel time expires. No automatic retry or reversal is issued.
# HA may show "open" for any non-closed state, not proof of a fully open endpoint.
# External remotes, obstructions and safety reversals can invalidate the opening estimate.
# This is not a safety interlock: verify travel time, contact polarity and opener behavior on site.
cover:
  - platform: template
    name: Door
    id: garage_door
    device_class: garage
    optimistic: false
    assumed_state: true
    restore_mode: NO_RESTORE
    lambda: |-
      if (!id(magnetic_contact).has_state()) return {};
      const auto operation = id(garage_door).current_operation;
      const uint32_t travel_time = (uint32_t)(id(door_travel_time_sensor).state * 1000UL);
      const bool closed = id(magnetic_contact).state;

      if (operation != COVER_OPERATION_IDLE || id(garage_unknown_motion)) {
        const bool confirmed_close = closed &&
            (operation == COVER_OPERATION_CLOSING || id(garage_unknown_motion));
        if (!confirmed_close && (uint32_t)(::millis() - id(op_start)) < travel_time)
          return {};

        id(garage_open_estimated) = operation == COVER_OPERATION_OPENING && !closed;
        id(garage_unknown_motion) = false;
        id(op_start) = 0;
        id(garage_door).current_operation = COVER_OPERATION_IDLE;
        // 0.5 is an unknown/intermediate sentinel, not a measured percentage.
        id(garage_door).position = closed ? COVER_CLOSED :
            (id(garage_open_estimated) ? COVER_OPEN : 0.5f);
        id(garage_door).publish_state(false);
        if (operation == COVER_OPERATION_CLOSING && !closed)
          ESP_LOGW("cover", "Closing timed out without the closed contact; position unknown");
        if (operation == COVER_OPERATION_OPENING && closed)
          ESP_LOGW("cover", "Opening timed out with the closed contact still active");
        return {};
      }

      if (closed) id(garage_open_estimated) = false;
      return closed ? COVER_CLOSED : (id(garage_open_estimated) ? COVER_OPEN : 0.5f);

    open_action:
      - lambda: |-
          if (id(garage_door).current_operation != COVER_OPERATION_IDLE ||
              id(garage_unknown_motion) || id(pulse_relay).is_running()) return;
          if (!id(magnetic_contact).has_state() || !id(magnetic_contact).state) {
            ESP_LOGD("cover", "Ignoring OPEN: closed endpoint is not confirmed");
            return;
          }
          id(garage_open_estimated) = false;
          id(garage_door).current_operation = COVER_OPERATION_OPENING;
          id(garage_door).position = 0.5f;
          id(op_start) = ::millis();
          id(pulse_relay).execute();
          id(garage_door).publish_state(false);
    close_action:
      - lambda: |-
          if (id(garage_door).current_operation != COVER_OPERATION_IDLE ||
              id(garage_unknown_motion) || id(pulse_relay).is_running()) return;
          if (!id(magnetic_contact).has_state() || id(magnetic_contact).state ||
              !id(garage_open_estimated)) {
            ESP_LOGD("cover", "Ignoring CLOSE: already closed or open endpoint is unknown");
            return;
          }
          id(garage_open_estimated) = false;
          id(garage_door).current_operation = COVER_OPERATION_CLOSING;
          id(garage_door).position = 0.5f;
          id(op_start) = ::millis();
          id(pulse_relay).execute();
          id(garage_door).publish_state(false);
    toggle_action:
      - lambda: |-
          if (id(garage_door).current_operation != COVER_OPERATION_IDLE ||
              id(garage_unknown_motion) || id(pulse_relay).is_running() ||
              !id(magnetic_contact).has_state()) return;
          if (id(magnetic_contact).state) {
            id(garage_door).make_call().set_command_open().perform();
          } else if (id(garage_open_estimated)) {
            id(garage_door).make_call().set_command_close().perform();
          } else {
            // Deliberate toggle remains available when the opener's direction is unknown.
            ESP_LOGW("cover", "Explicit TOGGLE from unknown position; direction is not known");
            id(garage_unknown_motion) = true;
            id(op_start) = ::millis();
            id(garage_door).position = 0.5f;
            id(pulse_relay).execute();
            id(garage_door).publish_state(false);
          }

binary_sensor:
  - platform: gpio
    name: Toggle Button
    id: toggle_button
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      then:
        - script.execute: toggle_door

  - platform: gpio
    id: magnetic_contact
    name: Magnetic Contact
    pin:
      number: ${magnetic_pin}
      mode: INPUT_PULLUP
    filters:
      - delayed_on: ${magnetic_contact_delay}

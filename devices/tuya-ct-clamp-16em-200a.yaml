    id: total_pf
    internal: 'false'
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float S = id(phase_a_voltage).state * fabsf(id(phase_a_current).state)
        + id(phase_b_voltage).state * fabsf(id(phase_b_current).state)
        + id(phase_c_voltage).state * fabsf(id(phase_c_current).state);
      const float P = id(total_power).state; // W
      if (S <= 0) return NAN;
      float pf = fabsf(P) / S;
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1


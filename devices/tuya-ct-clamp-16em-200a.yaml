substitutions:
  name: tuya-ct-clamp-16em-200a
  friendly_name: Tuya CT Clamp 16EM 200A
  voltage_scale: '0.1' # 0.1 V/count
  current_scale: '0.001' # 0.001 A/count
  power_scale: '1' # 1 W/count (was 0.001 kW/count)
  freq_scale: '1' # 1 Hz/count
  energy_scale: '0.01' # 0.01 kWh/count (DP 115–132)

  # Display-name substitutions
  phA_name: Phase A
  phB_name: Phase B
  phC_name: Phase C
  c01_name: C01
  c02_name: C02
  c03_name: C03
  c04_name: C04
  c05_name: C05
  c06_name: C06
  c07_name: C07
  c08_name: C08
  c09_name: C09
  c10_name: C10
  c11_name: C11
  c12_name: C12
  c13_name: C13
  c14_name: C14
  c15_name: C15
  c16_name: C16

  # Visibility toggles (use 'true' or 'false')
  phA_internal: 'false'
  phB_internal: 'false'
  phC_internal: 'false'
  c01_internal: 'false'
  c02_internal: 'false'
  c03_internal: 'false'
  c04_internal: 'false'
  c05_internal: 'false'
  c06_internal: 'false'
  c07_internal: 'false'
  c08_internal: 'false'
  c09_internal: 'false'
  c10_internal: 'false'
  c11_internal: 'false'
  c12_internal: 'false'
  c13_internal: 'false'
  c14_internal: 'false'
  c15_internal: 'false'
  c16_internal: 'false'
  sol_internal: 'false'

packages:
  - !include ../packages/boards/tuya/cbu.yaml
  - !include ../packages/modules/tuya-product.yaml

esphome:
  on_boot:
    - priority: -100
      then:
        - delay: 5s
        - button.press: refresh_ct_detection

# Daily reboot to keep the TuyaMCU communication sane - avoid CRC errors caused by memory leaks or who knows what
time:
  - id: !extend ha_time
    on_time:
      - seconds: 0
        minutes: 30
        hours: 3
        then:
          - logger.log: 'Scheduled daily reboot triggered'
          - button.press: mcu_restart

logger:
  baud_rate: 0
  level: INFO

uart:
  id: tuya_uart
  rx_pin: P10
  tx_pin: P11
  baud_rate: 115200
  rx_buffer_size: 1024

tuya:
  id: my_meter
  uart_id: tuya_uart
  time_id: ha_time
  on_datapoint_update:
    # Phase A raw -> publish
    - sensor_datapoint: 101
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 13) {
              ESP_LOGW("tuya", "Phase A Data (DP 101) has invalid length %zu; expected 13", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(phase_a_voltage).publish_state(read_u32_le(0) * ${voltage_scale});
            id(phase_a_current).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${current_scale});
            id(phase_a_power).publish_state(static_cast<int32_t>(read_u32_le(8)) * ${power_scale});

    # Phase B raw -> publish
    - sensor_datapoint: 102
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 13) {
              ESP_LOGW("tuya", "Phase B Data (DP 102) has invalid length %zu; expected 13", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(phase_b_voltage).publish_state(read_u32_le(0) * ${voltage_scale});
            id(phase_b_current).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${current_scale});
            id(phase_b_power).publish_state(static_cast<int32_t>(read_u32_le(8)) * ${power_scale});

    # Phase C raw -> publish
    - sensor_datapoint: 103
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 13) {
              ESP_LOGW("tuya", "Phase C Data (DP 103) has invalid length %zu; expected 13", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(phase_c_voltage).publish_state(read_u32_le(0) * ${voltage_scale});
            id(phase_c_current).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${current_scale});
            id(phase_c_power).publish_state(static_cast<int32_t>(read_u32_le(8)) * ${power_scale});

    # Total raw -> publish
    - sensor_datapoint: 104
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 9) {
              ESP_LOGW("tuya", "Total Data (DP 104) has invalid length %zu; expected 9", x.size());
              return;
            }
            auto read_u32_le = [&x](size_t offset) -> uint32_t {
              return static_cast<uint32_t>(x[offset])
                | (static_cast<uint32_t>(x[offset + 1]) << 8)
                | (static_cast<uint32_t>(x[offset + 2]) << 16)
                | (static_cast<uint32_t>(x[offset + 3]) << 24);
            };
            id(total_current).publish_state(static_cast<int32_t>(read_u32_le(0)) * ${current_scale});
            id(total_power).publish_state(static_cast<int32_t>(read_u32_le(4)) * ${power_scale});
            id(grid_frequency).publish_state(x[8] * ${freq_scale});

    # Sub-circuit Power
    - sensor_datapoint: 105
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Sub-circuit Power (DP 105) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 5;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Sub-circuit Power (DP 105) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            for (size_t i = 0; i < count; i++) {
              const size_t offset = 1 + i * 5;
              const uint8_t circuit_id = x[offset];
              const uint32_t raw_value = static_cast<uint32_t>(x[offset + 1])
                | (static_cast<uint32_t>(x[offset + 2]) << 8)
                | (static_cast<uint32_t>(x[offset + 3]) << 16)
                | (static_cast<uint32_t>(x[offset + 4]) << 24);
              const float value = static_cast<int32_t>(raw_value) * ${power_scale};
              switch (circuit_id) {
                case 1:  id(circuit_1_power).publish_state(value); break;
                case 2:  id(circuit_2_power).publish_state(value); break;
                case 3:  id(circuit_3_power).publish_state(value); break;
                case 4:  id(circuit_4_power).publish_state(value); break;
                case 5:  id(circuit_5_power).publish_state(value); break;
                case 6:  id(circuit_6_power).publish_state(value); break;
                case 7:  id(circuit_7_power).publish_state(value); break;
                case 8:  id(circuit_8_power).publish_state(value); break;
                case 9:  id(circuit_9_power).publish_state(value); break;
                case 10: id(circuit_10_power).publish_state(value); break;
                case 11: id(circuit_11_power).publish_state(value); break;
                case 12: id(circuit_12_power).publish_state(value); break;
                case 13: id(circuit_13_power).publish_state(value); break;
                case 14: id(circuit_14_power).publish_state(value); break;
                case 15: id(circuit_15_power).publish_state(value); break;
                case 16: id(circuit_16_power).publish_state(value); break;
                default:
                  ESP_LOGW("tuya", "Sub-circuit Power (DP 105) reported invalid circuit ID %u", circuit_id);
                  break;
              }
            }

    # Sub-circuit Current
    - sensor_datapoint: 106
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Sub-circuit Current (DP 106) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 5;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Sub-circuit Current (DP 106) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            for (size_t i = 0; i < count; i++) {
              const size_t offset = 1 + i * 5;
              const uint8_t circuit_id = x[offset];
              const uint32_t raw_value = static_cast<uint32_t>(x[offset + 1])
                | (static_cast<uint32_t>(x[offset + 2]) << 8)
                | (static_cast<uint32_t>(x[offset + 3]) << 16)
                | (static_cast<uint32_t>(x[offset + 4]) << 24);
              const float value = raw_value * ${current_scale};
              switch (circuit_id) {
                case 1:  id(circuit_1_current).publish_state(value); break;
                case 2:  id(circuit_2_current).publish_state(value); break;
                case 3:  id(circuit_3_current).publish_state(value); break;
                case 4:  id(circuit_4_current).publish_state(value); break;
                case 5:  id(circuit_5_current).publish_state(value); break;
                case 6:  id(circuit_6_current).publish_state(value); break;
                case 7:  id(circuit_7_current).publish_state(value); break;
                case 8:  id(circuit_8_current).publish_state(value); break;
                case 9:  id(circuit_9_current).publish_state(value); break;
                case 10: id(circuit_10_current).publish_state(value); break;
                case 11: id(circuit_11_current).publish_state(value); break;
                case 12: id(circuit_12_current).publish_state(value); break;
                case 13: id(circuit_13_current).publish_state(value); break;
                case 14: id(circuit_14_current).publish_state(value); break;
                case 15: id(circuit_15_current).publish_state(value); break;
                case 16: id(circuit_16_current).publish_state(value); break;
                default:
                  ESP_LOGW("tuya", "Sub-circuit Current (DP 106) reported invalid circuit ID %u", circuit_id);
                  break;
              }
            }

    # Per-circuit phase assignment
    - sensor_datapoint: 107
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Circuit Phase Assignments (DP 107) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 2;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Circuit Phase Assignments (DP 107) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            std::string summary;
            for (size_t i = 0; i < count; i++) {
              const uint8_t circuit_id = x[1 + i * 2];
              const uint8_t phase_id = x[2 + i * 2];
              if (circuit_id < 1 || circuit_id > 16) {
                ESP_LOGW("tuya", "Circuit Phase Assignments (DP 107) reported invalid circuit ID %u", circuit_id);
                continue;
              }
              const char *phase;
              switch (phase_id) {
                case 0: phase = "Auto"; break;
                case 1: phase = "A"; break;
                case 2: phase = "B"; break;
                case 3: phase = "C"; break;
                default: phase = "Unknown"; break;
              }
              if (!summary.empty()) {
                summary += ", ";
              }
              summary += str_sprintf("C%02u=%s", circuit_id, phase);
              if (phase_id > 3) {
                summary += str_sprintf("(%u)", phase_id);
              }
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Circuit Phase Assignments (DP 107): %s", summary.c_str());

    # Meter Type (text_sensor)
    - sensor_datapoint: 108
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) { // 0=unknow,1=3_phase,2=1_phase,3=1_phase_3_wire,4=other
              case 1: id(meter_type).publish_state("3 phase"); break;
              case 2: id(meter_type).publish_state("1 phase"); break;
              case 3: id(meter_type).publish_state("1 phase / 3 wire"); break;
              case 4: id(meter_type).publish_state("Other"); break;
              default: id(meter_type).publish_state("Unknown"); break;
            }

    # Per-circuit solar configuration
    - sensor_datapoint: 109
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Solar Circuits (DP 109) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 2;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Solar Circuits (DP 109) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            std::string summary;
            for (size_t i = 0; i < count; i++) {
              const uint8_t circuit_id = x[1 + i * 2];
              const uint8_t solar_flag = x[2 + i * 2];
              if (circuit_id < 1 || circuit_id > 16) {
                ESP_LOGW("tuya", "Solar Circuits (DP 109) reported invalid circuit ID %u", circuit_id);
                continue;
              }
              if (solar_flag == 1) {
                if (!summary.empty()) {
                  summary += ", ";
                }
                summary += str_sprintf("C%02u", circuit_id);
              } else if (solar_flag != 0) {
                ESP_LOGW("tuya", "Solar Circuits (DP 109) reported unknown flag %u for circuit %u", solar_flag, circuit_id);
              }
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Solar Circuits (DP 109): %s", summary.c_str());

    # Per-circuit voltage multiplier
    - sensor_datapoint: 111
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.empty()) {
              ESP_LOGW("tuya", "Voltage Multipliers (DP 111) is empty");
              return;
            }
            const size_t count = x[0];
            const size_t expected_size = 1 + count * 2;
            if (count > 16 || x.size() != expected_size) {
              ESP_LOGW("tuya", "Voltage Multipliers (DP 111) has invalid count/length: count=%zu, length=%zu, expected=%zu", count, x.size(), expected_size);
              return;
            }
            std::string summary;
            for (size_t i = 0; i < count; i++) {
              const uint8_t circuit_id = x[1 + i * 2];
              const uint8_t multiplier = x[2 + i * 2];
              if (circuit_id < 1 || circuit_id > 16) {
                ESP_LOGW("tuya", "Voltage Multipliers (DP 111) reported invalid circuit ID %u", circuit_id);
                continue;
              }
              if (!summary.empty()) {
                summary += ", ";
              }
              summary += str_sprintf("C%02u=%u", circuit_id, multiplier);
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Voltage Multipliers (DP 111, raw values): %s", summary.c_str());

    # Global solar-accounting mode
    - sensor_datapoint: 112
      datapoint_type: enum
      then:
        - lambda: |-
            switch (x) {
              case 1: id(solar_accounting).publish_state("Disabled"); break;
              case 2: id(solar_accounting).publish_state("Enabled"); break;
              default:
                id(solar_accounting).publish_state("Unknown");
                ESP_LOGW("tuya", "Solar Accounting (DP 112) reported unknown value: %u", x);
                break;
            }

    # CT Insertion Detection
    - sensor_datapoint: 113
      datapoint_type: raw
      then:
        - lambda: |-
            if (x.size() != 4) {
              ESP_LOGW("tuya", "Detected CT Inputs (DP 113) has invalid length %zu; expected 4", x.size());
              return;
            }
            const uint32_t mask = static_cast<uint32_t>(x[0])
              | (static_cast<uint32_t>(x[1]) << 8)
              | (static_cast<uint32_t>(x[2]) << 16)
              | (static_cast<uint32_t>(x[3]) << 24);
            id(circuit_1_ct_detected).publish_state((mask & (1UL << 0)) != 0);
            id(circuit_2_ct_detected).publish_state((mask & (1UL << 1)) != 0);
            id(circuit_3_ct_detected).publish_state((mask & (1UL << 2)) != 0);
            id(circuit_4_ct_detected).publish_state((mask & (1UL << 3)) != 0);
            id(circuit_5_ct_detected).publish_state((mask & (1UL << 4)) != 0);
            id(circuit_6_ct_detected).publish_state((mask & (1UL << 5)) != 0);
            id(circuit_7_ct_detected).publish_state((mask & (1UL << 6)) != 0);
            id(circuit_8_ct_detected).publish_state((mask & (1UL << 7)) != 0);
            id(circuit_9_ct_detected).publish_state((mask & (1UL << 8)) != 0);
            id(circuit_10_ct_detected).publish_state((mask & (1UL << 9)) != 0);
            id(circuit_11_ct_detected).publish_state((mask & (1UL << 10)) != 0);
            id(circuit_12_ct_detected).publish_state((mask & (1UL << 11)) != 0);
            id(circuit_13_ct_detected).publish_state((mask & (1UL << 12)) != 0);
            id(circuit_14_ct_detected).publish_state((mask & (1UL << 13)) != 0);
            id(circuit_15_ct_detected).publish_state((mask & (1UL << 14)) != 0);
            id(circuit_16_ct_detected).publish_state((mask & (1UL << 15)) != 0);
            std::string summary;
            for (uint8_t circuit_id = 1; circuit_id <= 16; circuit_id++) {
              if ((mask & (1UL << (circuit_id - 1))) == 0) {
                continue;
              }
              if (!summary.empty()) {
                summary += ", ";
              }
              summary += str_sprintf("C%02u", circuit_id);
            }
            if (summary.empty()) {
              summary = "None";
            }
            ESP_LOGI("tuya", "Detected CT Inputs (DP 113, mask 0x%08" PRIX32 "): %s", mask, summary.c_str());


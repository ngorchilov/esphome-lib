text_sensor:
  - platform: template
    name: Measurement Type
    id: meter_type
    internal: false
    icon: mdi:meter-electric

button:
  - platform: template
    name: Refresh Solar Configuration
    id: refresh_solar_configuration
    entity_category: diagnostic
    icon: mdi:solar-power
    on_press:
      - lambda: id(my_meter).force_set_enum_datapoint_value(114, 0);

  - platform: template
    name: Refresh CT Detection
    id: refresh_ct_detection
    entity_category: diagnostic
    icon: mdi:current-ac
    on_press:
      - lambda: id(my_meter).force_set_enum_datapoint_value(114, 1);

sensor:
  # Phase A
  - platform: template
    name: ${phA_name} Voltage
    id: phase_a_voltage
    internal: ${phA_internal}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: ${phA_name} Current
    id: phase_a_current
    internal: ${phA_internal}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: ${phA_name} Power
    id: phase_a_power
    internal: ${phA_internal}
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: ${phA_name} Apparent Power
    id: phase_a_va
    internal: ${phA_internal}
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sigma
    lambda: return id(phase_a_voltage).state * fabsf(id(phase_a_current).state);

  - platform: template
    name: ${phA_name} Power Factor
    id: phase_a_pf
    internal: ${phA_internal}
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float V = id(phase_a_voltage).state;
      const float I = id(phase_a_current).state;
      const float P = id(phase_a_power).state; // W
      if (V <= 0 || I == 0) return NAN;
      float pf = fabsf(P) / (V * fabsf(I));
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1

  # Phase B
  - platform: template
    name: ${phB_name} Voltage
    id: phase_b_voltage
    internal: ${phB_internal}
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1

  - platform: template
    name: ${phB_name} Current
    id: phase_b_current
    internal: ${phB_internal}
    unit_of_measurement: A
    device_class: current
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
    name: ${phB_name} Power
    id: phase_b_power
    internal: ${phB_internal}
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    name: ${phB_name} Apparent Power
    id: phase_b_va
    internal: ${phB_internal}
    unit_of_measurement: VA
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    icon: mdi:sigma
    lambda: return id(phase_b_voltage).state * fabsf(id(phase_b_current).state);

  - platform: template
    name: ${phB_name} Power Factor
    id: phase_b_pf
    internal: ${phB_internal}
    unit_of_measurement: '%'
    device_class: power_factor
    state_class: measurement
    accuracy_decimals: 1
    lambda: |-
      const float V = id(phase_b_voltage).state;
      const float I = id(phase_b_current).state;
      const float P = id(phase_b_power).state; // W
      if (V <= 0 || I == 0) return NAN;
      float pf = fabsf(P) / (V * fabsf(I));
      if (pf > 1) pf = 1;
      return pf * 100.0f;
    filters:
      - round: 1


select:
  - platform: template
    name: Solar Accounting
    id: solar_accounting
    internal: ${sol_internal}
    entity_category: config
    icon: mdi:solar-power
    options:
      - Unknown
      - Disabled
      - Enabled
    initial_option: Unknown
    optimistic: false
    set_action:
      - lambda: |-
          if (x == "Disabled") {
            id(my_meter).set_enum_datapoint_value(112, 1);
          } else if (x == "Enabled") {
            id(my_meter).set_enum_datapoint_value(112, 2);
          } else {
            ESP_LOGW("tuya", "Solar Accounting 'Unknown' is read-only; no DP 112 value was written");
          }

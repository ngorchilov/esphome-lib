substitutions:
  name: tuya-dry-relay-2dc-10a
  friendly_name: Tuya Dry Relay 2DC 10A

  relay1_pin: GPIO14
  relay1_inverted: false
  button1_pin: GPIO9
  button1_inverted: true

  relay2_pin: GPIO6
  relay2_inverted: false
  button2_pin: GPIO24
  button2_inverted: true

  master_switch_pin: GPIO8
  master_switch_inverted: true
  master_switch_pullup: true

  status_led_pin: GPIO26
  status_led_inverted: true

  rf433_pin: GPIO7
  rf433_inverted: false

  relay_1_enabled: ${ (relay_1_entity | default({})).get("enabled", true) }
  relay_2_enabled: ${ (relay_2_entity | default({})).get("enabled", true) }

  _relay_1_state:
    - binary_sensor.is_on: relay_1_power_state
  _relay_2_state:
    - binary_sensor.is_on: relay_2_power_state
  _relay_1_on:
    - script.execute: relay_1_power_on
  _relay_2_on:
    - script.execute: relay_2_power_on
  _relay_1_off:
    - script.execute: relay_1_power_off
  _relay_2_off:
    - script.execute: relay_2_power_off

  # The master button operates only enabled channels and is omitted if neither is enabled.
  _master_switch_pkg:
    binary_sensor:
      - platform: gpio
        name: Master Switch
        id: master_switch
        pin:
          number: ${master_switch_pin}
          inverted: ${master_switch_inverted}
          mode:
            input: true
            pullup: ${master_switch_pullup}
        on_click:
          - if:
              condition:
                or: ${ (_relay_1_state if relay_1_enabled else []) + (_relay_2_state if relay_2_enabled else []) }
              then: ${ (_relay_1_off if relay_1_enabled else []) + (_relay_2_off if relay_2_enabled else []) }
              else: ${ (_relay_1_on if relay_1_enabled else []) + (_relay_2_on if relay_2_enabled else []) }

packages:
  - !include ../packages/boards/tuya/cb3s.yaml
  - !include
    file: ../packages/modules/remote-receiver-rc-switch.yaml
    vars:
      receiver:
        enabled: ${ (rf433 | default({})).get("enabled", false) }
        id: rf433_receiver
        pin: ${rf433_pin}
        inverted: ${rf433_inverted}
        buffer_size: ${ (rf433 | default({})).get("buffer_size", "4kb") }
        filter: ${ (rf433 | default({})).get("filter", "150us") }
        idle: ${ (rf433 | default({})).get("idle", "4ms") }
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: relay_1
        entity: '${ relay_1_entity | default({"type": "switch", "name": "Relay 1"}) }'
        power:
          pin: ${relay1_pin}
          inverted: ${relay1_inverted}
        control:
          mode: local
        integrated_button:
          enabled: true
          name: Button 1
          pin: ${button1_pin}
          inverted: ${button1_inverted}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: relay_2
        entity: '${ relay_2_entity | default({"type": "switch", "name": "Relay 2"}) }'
        power:
          pin: ${relay2_pin}
          inverted: ${relay2_inverted}
        control:
          mode: local
        integrated_button:
          enabled: true
          name: Button 2
          pin: ${button2_pin}
          inverted: ${button2_inverted}
  - ${ _master_switch_pkg if relay_1_enabled or relay_2_enabled else {} }

status_led:
  pin:
    number: ${status_led_pin}
    inverted: ${status_led_inverted}

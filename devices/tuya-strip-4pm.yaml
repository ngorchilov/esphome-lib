# power_strip.profile: cbu | t1u. Four sockets and one switched USB supply.
substitutions:
  name: tuya-strip-4pm
  friendly_name: Tuya Strip 4PM
  power_strip_profile: ${ (power_strip | default({})).get("profile", "cbu") }
  power_strip_board: ${ power_strip_profile if power_strip_profile in ['cbu', 't1u'] else 'unsupported-power-strip-profile' }
  power_strip_pins: >-
    ${ {'cbu': {'led': 'GPIO20', 'relays': ['GPIO6', 'GPIO7', 'GPIO8', 'GPIO9', 'GPIO26']},
        't1u': {'led': 'GPIO23', 'relays': ['GPIO26', 'GPIO9', 'GPIO24', 'GPIO21', 'GPIO6']}}
        .get(power_strip_profile, {}) }

  led_pin: ${power_strip_pins.led}
  led_inverted: false

  button_pin: GPIO22
  button_pullup: true
  button_inverted: true

  relay1_pin: ${power_strip_pins.relays[0]}
  relay1_inverted: false
  relay1_id: socket_1
  relay1_name: Socket 1

  relay2_pin: ${power_strip_pins.relays[1]}
  relay2_inverted: false
  relay2_id: socket_2
  relay2_name: Socket 2

  relay3_pin: ${power_strip_pins.relays[2]}
  relay3_inverted: false
  relay3_id: socket_3
  relay3_name: Socket 3

  relay4_pin: ${power_strip_pins.relays[3]}
  relay4_inverted: false
  relay4_id: socket_4
  relay4_name: Socket 4

  relay5_pin: ${power_strip_pins.relays[4]}
  relay5_inverted: false
  relay5_id: relay_usb
  relay5_name: Relay USB

packages:
  - !include ../packages/boards/tuya/${power_strip_board}.yaml
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay1_id}
        entity:
          type: switch
          name: ${relay1_name}
        power:
          pin: ${relay1_pin}
          inverted: ${relay1_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay1_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay2_id}
        entity:
          type: switch
          name: ${relay2_name}
        power:
          pin: ${relay2_pin}
          inverted: ${relay2_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay2_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay3_id}
        entity:
          type: switch
          name: ${relay3_name}
        power:
          pin: ${relay3_pin}
          inverted: ${relay3_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay3_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay4_id}
        entity:
          type: switch
          name: ${relay4_name}
        power:
          pin: ${relay4_pin}
          inverted: ${relay4_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay4_name}
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: ${relay5_id}
        entity:
          type: switch
          name: ${relay5_name}
        power:
          pin: ${relay5_pin}
          inverted: ${relay5_inverted}
        control:
          mode: local
        power_cycle:
          enabled: true
          name: Reboot ${relay5_name}
  - !include ../packages/modules/energy-monitoring-bl0942.yaml
  - !include
    file: ../packages/modules/relay-group.yaml
    vars:
      relay_group:
        id: strip_power
        members:
          - ${relay1_id}
          - ${relay2_id}
          - ${relay3_id}
          - ${relay4_id}
          - ${relay5_id}
        state_id: power_status
        indicator_id: status_led

output:
  - platform: gpio
    id: led_output
    pin: ${led_pin}
    inverted: ${led_inverted}

light:
  - platform: binary
    id: status_led
    output: led_output

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: ${button_pin}
      mode:
        input: true
        pullup: ${button_pullup}
      inverted: ${button_inverted}
    on_press:
      - script.execute: strip_power_toggle

  _fan433_board_cc1101_pkg: !include ../../packages/boards/espressif/esp32dev.yaml

packages:
  - ${ _fan433_board_sx127x_pkg if fan433_board_radio == 'sx127x' else _fan433_board_cc1101_pkg }

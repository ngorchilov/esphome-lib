substitutions:
  name: tuya-ct-clamp-2em-80a-cb2s
  friendly_name: Tuya CT Clamp 2EM 80A (CB2S)

  uart_tx_pin: GPIO11
  uart_rx_pin: GPIO10
  uart_baud_rate: 9600

  channel_a_name: ${ (ct_clamp | default({})).get("channels", {}).get("a_name", "Channel A") }
  channel_b_name: ${ (ct_clamp | default({})).get("channels", {}).get("b_name", "Channel B") }

  power_scale: 0.1 # DP 101, 105, 115
  energy_scale: 0.01 # DP 106, 107, 108, 109, 130, 131
  frequency_scale: 0.01 # DP 111
  voltage_scale: 0.1 # DP 112
  current_scale: 0.001 # DP 113, 114

packages:
  - !include ../packages/boards/tuya/cb2s.yaml
  - !include ../packages/modules/tuya-product.yaml

uart:
  id: tuya_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: ${uart_baud_rate}

text_sensor:
  - platform: template
    name: Flow Direction ${channel_a_name}
    id: current_flow_a
    icon: mdi:swap-horizontal

  - platform: template
    name: Flow Direction ${channel_b_name}
    id: current_flow_b
    icon: mdi:swap-horizontal

sensor:
  - platform: template
    name: Energy Consumed
    id: energy_consumed
    unit_of_measurement: kWh
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: Energy Produced
    id: energy_produced
    unit_of_measurement: kWh
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: Power ${channel_a_name}
    id: power_a
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement

  - platform: template
    name: Power ${channel_b_name}
    id: power_b
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement

  - platform: template
    name: Energy Consumed ${channel_a_name}
    id: energy_consumed_a
    unit_of_measurement: kWh
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: Energy Produced ${channel_a_name}
    id: energy_produced_a
    unit_of_measurement: kWh
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: Energy Consumed ${channel_b_name}
    id: energy_consumed_b
    unit_of_measurement: kWh
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: Energy Produced ${channel_b_name}
    id: energy_produced_b
    unit_of_measurement: kWh
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: Power Factor ${channel_a_name}
    id: power_factor_a
    unit_of_measurement: '%'
    accuracy_decimals: 0
    device_class: power_factor
    state_class: measurement

  - platform: template
    name: Power Factor ${channel_b_name}
    id: power_factor_b
    unit_of_measurement: '%'
    accuracy_decimals: 0
    device_class: power_factor
    state_class: measurement

  - platform: template
    name: Frequency
    id: frequency
    unit_of_measurement: Hz
    accuracy_decimals: 2
    device_class: frequency
    state_class: measurement

  - platform: template
    name: Voltage
    id: voltage
    unit_of_measurement: V
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement

  - platform: template
    name: Current ${channel_a_name}
    id: current_a
    unit_of_measurement: A
    accuracy_decimals: 3
    device_class: current
    state_class: measurement

  - platform: template
    name: Current ${channel_b_name}
    id: current_b
    unit_of_measurement: A
    accuracy_decimals: 3
    device_class: current
    state_class: measurement

  - platform: template
    name: Total Power
    id: total_power
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement

number:
  - platform: tuya
    name: Reporting Rate
    number_datapoint: 129
    min_value: 3
    max_value: 60
    step: 1
    unit_of_measurement: s
    mode: box
    device_class: duration

tuya:
  uart_id: tuya_uart
  time_id: ha_time
  on_datapoint_update:
    - sensor_datapoint: 101 # Power Channel A (DP 101)
      datapoint_type: int
      then:
        - lambda: |-
            id(power_a).publish_state(x * ${power_scale});

    - sensor_datapoint: 102 # Current Flow Direction Channel A
      datapoint_type: enum
      then:
        - lambda: |-
            if (x == 0) {
              id(current_flow_a).publish_state("Forward");
            } else {
              id(current_flow_a).publish_state("Reverse");
            }

    - sensor_datapoint: 104 # Current Flow Direction Channel B
      datapoint_type: enum
      then:
        - lambda: |-
            if (x == 0) {
              id(current_flow_b).publish_state("Forward");
            } else {
              id(current_flow_b).publish_state("Reverse");
            }

    - sensor_datapoint: 105 # Power Channel B (DP 105)
      datapoint_type: int
      then:
        - lambda: |-
            id(power_b).publish_state(x * ${power_scale});

    - sensor_datapoint: 106 # Energy Consumed Channel A (DP 106)
      datapoint_type: int
      then:
        - lambda: |-
            id(energy_consumed_a).publish_state(x * ${energy_scale});

    - sensor_datapoint: 107 # Energy Produced Channel A (DP 107)
      datapoint_type: int
      then:
        - lambda: |-
            id(energy_produced_a).publish_state(x * ${energy_scale});

    - sensor_datapoint: 108 # Energy Consumed Channel B (DP 108)
      datapoint_type: int
      then:
        - lambda: |-
            id(energy_consumed_b).publish_state(x * ${energy_scale});

    - sensor_datapoint: 109 # Energy Produced Channel B (DP 109)
      datapoint_type: int
      then:
        - lambda: |-
            id(energy_produced_b).publish_state(x * ${energy_scale});

    - sensor_datapoint: 110 # Power Factor Channel A (DP 110)
      datapoint_type: int
      then:
        - lambda: |-
            id(power_factor_a).publish_state(x);

    - sensor_datapoint: 111 # Frequency (DP 111)
      datapoint_type: int
      then:
        - lambda: |-
            id(frequency).publish_state(x * ${frequency_scale});

    - sensor_datapoint: 112 # Voltage (DP 112)
      datapoint_type: int
      then:
        - lambda: |-
            id(voltage).publish_state(x * ${voltage_scale});

    - sensor_datapoint: 113 # Current Channel A (DP 113)
      datapoint_type: int
      then:
        - lambda: |-
            id(current_a).publish_state(x * ${current_scale});

    - sensor_datapoint: 114 # Current Channel B (DP 114)
      datapoint_type: int
      then:
        - lambda: |-
            id(current_b).publish_state(x * ${current_scale});

    - sensor_datapoint: 115 # Total Power (DP 115)
      datapoint_type: int
      then:
        - lambda: |-
            id(total_power).publish_state(x * ${power_scale});

    - sensor_datapoint: 121 # Power Factor Channel B (DP 121)
      datapoint_type: int
      then:
        - lambda: |-
            id(power_factor_b).publish_state(x);

    - sensor_datapoint: 130 # Energy Consumed (DP 130)
      datapoint_type: int
      then:
        - lambda: |-
            id(energy_consumed).publish_state(x * ${energy_scale});

    - sensor_datapoint: 131 # Energy Produced (DP 131)
      datapoint_type: int
      then:
        - lambda: |-
            id(energy_produced).publish_state(x * ${energy_scale});

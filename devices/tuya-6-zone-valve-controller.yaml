# DRAFT / BENCH USE ONLY - not validated for unattended irrigation.
# Dual independent 74HC595 registers reported for this enclosure/CBU family:
# https://www.elektroda.com/rtvforum/topic4174509.html
# Confirmed on the bench: zone LED order 1..6, P28 status LED, P14 buzzer,
# and button pins P8/P6/P7. The short-press code below passes config/compile
# and host logic tests, but has not been flashed or verified on the panel.
# The Things Data Model describes stock cloud features, not a serial MCU protocol.
# Its schedules/countdowns are not implemented by this draft.
#
# REQUIRED OUTPUT VERIFICATION BEFORE USE:
# - Confirm COM, the supply/output ratings and actual terminal count. The supplied
#   manual covers 6/8 zones; this firmware controls only six.
# - Identify which register bank drives the valves and which drives only LEDs.
#   Both banks currently mirror the same bits and assume active-low outputs.
# - With a suitably rated load between COM and each zone, measure AC voltage in
#   both commanded states. Expected: OFF near zero, ON near supply voltage.
#   Connect/disconnect the load with power removed; keep the meter in voltage mode.
# - Unloaded readings were about 28.5 VAC OFF and 13.2..14.5 VAC ON. These do not
#   establish polarity: leakage and insufficient triac load can mislead a meter.
# - If loaded operation is reversed, correct the VALVE bank's polarity only after
#   identifying it. Correct LED behaviour does not prove correct valve polarity.
# - Check every zone independently, other zones remaining off, and power-on/reboot
#   behaviour. ALWAYS_OFF and HA switch states are commands, not output feedback.
#
# BUTTON WIRING AND BEHAVIOUR - TO BE FINALIZED:
# Physical inputs are active-low with pullups: Left/Previous P7, Right/Next P6,
# Confirm (custom Stop) P8. Factory descriptions below come from the owner manual.
#
# Factory option (reference, NOT implemented):
# - Left short: select zone left. Left long: beep, open all zone valves in sequence.
# - Right short: select zone right. Right long: beep, close all valves in sequence.
# - Confirm short: confirm irrigation area. Confirm long: flash Wi-Fi LED and enter
#   network pairing. Hold durations and "in sequence" timing are unspecified.
#
# Custom option (short presses implemented below; bench confirmation pending):
# - Previous/Next immediately activate the previous/next zone, switching others off.
#   Navigation wraps 1..6 and follows an active zone, including HA changes. If HA
#   enables several, keep the selected active zone or fall back to the first active.
# - Stop turns all zones off and remembers the last zone for panel_selection_timeout
#   (30s). The timer starts only when all zones are off; active zones never expire.
# - A second Stop while already off cancels the timer and resets selection now.
#   After expiry/reset, Next starts zone 1 and Previous starts zone 6.
# - Proposed additions, NOT implemented: optional short acknowledgement beep and
#   long Stop to stop/reset immediately; no special long Previous/Next action.
# - Current handlers run once on press, including when held. They do not yet
#   distinguish short/long presses. Holding Stop blocks Previous/Next navigation.
# - Zone LEDs show commanded output state, not a separate preview selection.
#   No button resets Wi-Fi credentials, enters pairing, or opens every zone.
# Keep network recovery separate when finalizing; UART recovery needs pogo pins.

substitutions:
  name: tuya-6-zone-valve-controller
  friendly_name: Tuya 6-Zone Valve Controller
  # Remember the last zone after all zones stop, not a watering timeout.
  # Stock timing is unknown; active zones never expire from the selection.
  panel_selection_timeout: 30s

packages:
  - !include ../packages/boards/tuya/cbu.yaml

globals:
  - id: panel_selected_zone
    type: int
    restore_value: false
    initial_value: '0'

script:
  - id: panel_forget_selection
    mode: restart
    then:
      - delay: ${panel_selection_timeout}
      - lambda: id(panel_selected_zone) = 0;

  - id: panel_track_outputs
    then:
      - lambda: |-
          switch_::Switch *valves[] = {
            id(valve1), id(valve2), id(valve3),
            id(valve4), id(valve5), id(valve6)
          };
          for (int i = 0; i < 6; ++i) {
            if (!valves[i]->state)
              continue;
            // Follow an active zone, including changes made from Home Assistant.
            const int selected = id(panel_selected_zone);
            if (selected < 1 || selected > 6 || !valves[selected - 1]->state)
              id(panel_selected_zone) = i + 1;
            id(panel_forget_selection).stop();
            return;
          }
          id(panel_forget_selection).execute();

  - id: panel_activate_zone
    parameters:
      zone: int
    then:
      - lambda: |-
          switch_::Switch *valves[] = {
            id(valve1), id(valve2), id(valve3),
            id(valve4), id(valve5), id(valve6)
          };
          // Clear all commanded outputs before selecting the next zone; zero stops.
          for (auto *valve : valves)
            valve->turn_off();
          if (zone >= 1 && zone <= 6)
            valves[zone - 1]->turn_on();

  - id: panel_stop
    then:
      - if:
          condition:
            lambda: |-
              return id(valve1).state || id(valve2).state || id(valve3).state ||
                     id(valve4).state || id(valve5).state || id(valve6).state;
          then:
            - script.execute:
                id: panel_activate_zone
                zone: 0
            - script.execute: panel_forget_selection
          else:
            - script.stop: panel_forget_selection
            - lambda: id(panel_selected_zone) = 0;

  - id: panel_cycle
    parameters:
      direction: int
    then:
      - if:
          condition:
            binary_sensor.is_off: panel_button_p8
          then:
            - lambda: |-
                const int current = id(panel_selected_zone);
                id(panel_selected_zone) = current == 0
                  ? (direction > 0 ? 1 : 6)
                  : ((current - 1 + direction + 6) % 6) + 1;
            - script.execute:
                id: panel_activate_zone
                zone: !lambda return id(panel_selected_zone);

sn74hc595:
  # OpenBeken's argument order is DATA, LATCH, CLOCK, not DATA, CLOCK, LATCH.
  # Both independent banks receive the same six channel bits in the teardown.
  # Invert DATA, not individual output pins: the native zero-filled startup
  # buffer then shifts 0xFF (OFF if active-low is confirmed), including unused bits.
  # This does not guarantee electrical state before the first latch at power-on.
  - id: irrigation_bank_a
    data_pin:
      number: P16
      inverted: true
    latch_pin: P20
    clock_pin: P22
    sr_count: 1

  - id: irrigation_bank_b
    data_pin:
      number: P9
      inverted: true
    latch_pin: P17
    clock_pin: P15
    sr_count: 1

output:
  - platform: gpio
    id: zone1_mirror
    pin:
      sn74hc595: irrigation_bank_b
      number: 0
  - platform: gpio
    id: zone2_mirror
    pin:
      sn74hc595: irrigation_bank_b
      number: 1
  - platform: gpio
    id: zone3_mirror
    pin:
      sn74hc595: irrigation_bank_b
      number: 2
  - platform: gpio
    id: zone4_mirror
    pin:
      sn74hc595: irrigation_bank_b
      number: 3
  - platform: gpio
    id: zone5_mirror
    pin:
      sn74hc595: irrigation_bank_b
      number: 4
  - platform: gpio
    id: zone6_mirror
    pin:
      sn74hc595: irrigation_bank_b
      number: 5

switch:
  - platform: gpio
    name: Valve 1
    id: valve1
    pin:
      sn74hc595: irrigation_bank_a
      number: 0
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: zone1_mirror
      - script.execute: panel_track_outputs
    on_turn_off:
      - output.turn_off: zone1_mirror
      - script.execute: panel_track_outputs

  - platform: gpio
    name: Valve 2
    id: valve2
    pin:
      sn74hc595: irrigation_bank_a
      number: 1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: zone2_mirror
      - script.execute: panel_track_outputs
    on_turn_off:
      - output.turn_off: zone2_mirror
      - script.execute: panel_track_outputs

  - platform: gpio
    name: Valve 3
    id: valve3
    pin:
      sn74hc595: irrigation_bank_a
      number: 2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: zone3_mirror
      - script.execute: panel_track_outputs
    on_turn_off:
      - output.turn_off: zone3_mirror
      - script.execute: panel_track_outputs

  - platform: gpio
    name: Valve 4
    id: valve4
    pin:
      sn74hc595: irrigation_bank_a
      number: 3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: zone4_mirror
      - script.execute: panel_track_outputs
    on_turn_off:
      - output.turn_off: zone4_mirror
      - script.execute: panel_track_outputs

  - platform: gpio
    name: Valve 5
    id: valve5
    pin:
      sn74hc595: irrigation_bank_a
      number: 4
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: zone5_mirror
      - script.execute: panel_track_outputs
    on_turn_off:
      - output.turn_off: zone5_mirror
      - script.execute: panel_track_outputs

  - platform: gpio
    name: Valve 6
    id: valve6
    pin:
      sn74hc595: irrigation_bank_a
      number: 5
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: zone6_mirror
      - script.execute: panel_track_outputs
    on_turn_off:
      - output.turn_off: zone6_mirror
      - script.execute: panel_track_outputs

  - platform: gpio
    name: 1. Status LED
    id: status_led
    entity_category: config
    pin:
      number: P28
      inverted: true
    restore_mode: ALWAYS_OFF
    icon: mdi:led-on

  - platform: gpio
    name: 2. Buzzer
    id: buzzer
    entity_category: config
    pin: P14
    restore_mode: ALWAYS_OFF
    icon: mdi:bell-alert

binary_sensor:
  - platform: gpio
    name: Panel Next
    id: panel_button_p6
    entity_category: diagnostic
    pin:
      number: P6
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute:
          id: panel_cycle
          direction: 1

  - platform: gpio
    name: Panel Previous
    id: panel_button_p7
    entity_category: diagnostic
    pin:
      number: P7
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute:
          id: panel_cycle
          direction: -1

  - platform: gpio
    name: Panel Stop
    id: panel_button_p8
    entity_category: diagnostic
    pin:
      number: P8
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - script.execute: panel_stop

button:
  - platform: template
    name: All Valves Off
    id: all_valves_off
    on_press:
      - script.execute: panel_stop

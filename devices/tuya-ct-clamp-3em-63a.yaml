switch:
  # TODO: Test as button after confirming LED blinking stops independently of switch state.
  - platform: tuya
    name: Identify Device
    switch_datapoint: 101

text_sensor:
  - platform: tuya
    name: Device ID
    sensor_datapoint: 19

number:
  - platform: tuya
    name: Update Interval
    number_datapoint: 102
    min_value: 30 # Actual tested device minimum; Tuya model says 225s.
    max_value: 3600
    step: 1
    unit_of_measurement: s

button:
  # Tuya defines DP12 as a bool; this device reports it as on, so force-send true as an action.
  - platform: template
    name: Reset Energy
    icon: mdi:counter
    on_press:
      - lambda: |-
          id(tuya_component).force_set_boolean_datapoint_value(12, true);

  # Tuya defines DP35 as online/offline enum; this device refreshes all DPs when the value changes.
  - platform: template
    name: Refresh Data
    icon: mdi:refresh
    on_press:
      - lambda: |-
          static bool next_refresh_value = false;
          id(tuya_component).set_enum_datapoint_value(35, next_refresh_value);
          next_refresh_value = !next_refresh_value; // toggle

substitutions:
  name: tuya-ct-clamp-3em-63a
  friendly_name: Tuya CT Clamp 3EM 63A

  voltage_scale: 0.1 # 0.1 V/count
  current_scale: 0.001 # 0.001 A/count
  power_scale: 0.001 # 0.001 kW/count
  power_factor_scale: 0.01 # 0.01 ratio/count
  energy_scale: 0.01 # 0.01 kWh/count
  frequency_scale: 0.01 # 0.01 Hz/count

packages:
  - !include ../packages/boards/tuya/cb2s.yaml
  - !include ../packages/modules/tuya-product.yaml

uart:
  id: tuya_uart
  tx_pin: TX1
  rx_pin: RX1
  baud_rate: ${ tuya_uart_baud_rate | default(115200) }


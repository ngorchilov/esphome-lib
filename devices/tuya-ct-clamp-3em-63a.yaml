sensor:
  - platform: tuya
    name: Total Consumed Energy
    sensor_datapoint: 1
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    filters:
      - multiply: ${energy_scale}

  - platform: tuya
    name: Total Produced Energy
    sensor_datapoint: 23
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    filters:
      - multiply: ${energy_scale}

  - platform: tuya
    name: Total Power
    sensor_datapoint: 29
    unit_of_measurement: W
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    # filters:
    #   - multiply: ${power_scale}


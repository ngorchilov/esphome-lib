substitutions:
  name: sonoff-basic-r4
  friendly_name: Sonoff BASIC R4

packages:
  - !include ../packages/boards/espressif/esp32-c3-devkitm-1.yaml
  - !include
    file: ../packages/modules/relay-control.yaml
    vars:
      rc:
        id: sbr4
        primary:
          type: ${ (device | default({})).get("type", "switch") }
          name: ${ (device | default({})).get("primary", {}).get("name", "none") }
        power:
          name: ${ (device | default({})).get("power", {}).get("name", "None") }
          internal: ${ (device | default({})).get("power", {}).get("internal", (device | default({})).get("type", "switch") in ("light", "valve")) }
          pin: GPIO4
          inverted: false
          strapping: false
        control:
          mode: ${ (device | default({})).get("control", {}).get("mode", "local") }
          entity_id: ${ (device | default({})).get("control", {}).get("entity_id", "") }
          service_on: ${ (device | default({})).get("control", {}).get("service_on", "light.turn_on") }
          service_off: ${ (device | default({})).get("control", {}).get("service_off", "light.turn_off") }
          service_toggle: ${ (device | default({})).get("control", {}).get("service_toggle", "light.toggle") }
        indicator_led:
          enabled: true
          pin: GPIO6
          inverted: false
          strapping: false
        integrated_button:
          enabled: true
          pin: GPIO9
          inverted: true
          strapping: true

external_components:
  - source: github://ssieb/esphome_components
    components: [magic_switch]

switch:
  - platform: template
    name: ${ (device | default({})).get("magic_switch", {}).get("dnd", {}).get("name", "Do Not Disturb") }
    id: sbr4_magic_switch_dnd
    internal: ${ not (device | default({})).get("magic_switch", {}).get("dnd", {}).get("enabled", false) }
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

magic_switch:
  id: sbr4_magic_switch
  pin:
    number: GPIO5
    inverted: false
    ignore_strapping_warning: false
  timeout: ${ (device | default({})).get("magic_switch", {}).get("timeout", "1ms") }
  on_switch:
    - if:
        condition:
          switch.is_off: sbr4_magic_switch_dnd
        then:
          - script.execute: sbr4_primary_toggle

esphome:
  project:
    name: SONOFF.BASICR4
    version: 1.0.0

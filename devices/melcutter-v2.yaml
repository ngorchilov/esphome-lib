substitutions:
  name: melcutter-v2
  friendly_name: MELcutter V2

  # Default Home Assistant entity_id used as the external temperature source.
  # Can be an empty string.
  default_remote_temperature_entity: ''

esphome:
  project:
    name: yepiq.MELCloud_Cutter
    version: 2.0b

  # Required for climate.mitsubishi_cn105.set_remote_temperature.
  # If remote temperature is not used, this can be lowered to 2026.4.0,
  # where the native mitsubishi_cn105 component was introduced.
  min_version: 2026.5.0

packages:
  - !include ../packages/boards/espressif/esp07.yaml

logger:
  level: INFO
  # CN105 uses GPIO1/GPIO3 on UART0, so serial logging must stay disabled.
  baud_rate: 0

uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: 1
  rx_pin: 3
  data_bits: 8
  parity: EVEN
  stop_bits: 1

globals:
  # Last successful refresh from Home Assistant, even if the temperature value
  # is unchanged. Used only to clear the override if HA stops replying.
  - id: remote_temperature_last_refresh
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # True after we have sent a remote temperature override to the heat pump.
  - id: remote_temperature_override_active
    type: bool
    restore_value: false
    initial_value: 'false'

# Climate entity configuration
climate:
  - platform: mitsubishi_cn105
    id: hp
    name: Heat Pump
    uart_id: HP_UART
    visual:
      min_temperature: 16
      max_temperature: 31
      temperature_step:
        target_temperature: 1
        current_temperature: 0.5
    update_interval: 2s
    # Match the previous config's fast current-temperature polling.
    # Increase to 60s, the native component default, if the AC reports noisy room temperatures.
    current_temperature_min_interval: 2s

# Native mitsubishi_cn105 does not use these external-component options:
# - fahrenheit_compatibility: Home Assistant handles unit display.
# - debounce_delay: no native equivalent.
# - remote_temperature_timeout: recreated below with globals plus clear_remote_temperature.
#
# These external-component sub-entities are not exposed as YAML entities by the
# native component in ESPHome 2026.5.0:
# - compressor_frequency_sensor, outside_air_temperature_sensor, isee_sensor
# - stage_sensor, sub_mode_sensor, auto_sub_mode_sensor
# - input_power_sensor, kwh_sensor, runtime_hours_sensor
# - night_mode_switch, air_purifier_switch, circulator_switch
# - vertical_vane_select, horizontal_vane_select, airflow_control_select

text:
  # External Temp Sensor Entity ID
  - platform: template
    # HA entity_id to use as the external temperature source.
    name: Remote Temperature Entity
    id: remote_temperature_entity
    # Used only on first boot / when no restored value is present.
    initial_value: ${default_remote_temperature_entity}
    mode: text
    optimistic: true
    restore_value: true
    entity_category: CONFIG

sensor:
  # External Temp Sensor
  - platform: template
    id: remote_temperature
    name: Remote Temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: °C
    accuracy_decimals: 1
    update_interval: never
    filters:
      # Uncomment the lambda line to convert F to C on incoming temperature.
      #  - lambda: return (x - 32) * (5.0 / 9.0);
      - clamp: # Limits values to the native action's accepted range.
          min_value: 8.0
          max_value: 39.5
          ignore_out_of_range: true
      - throttle: 30s
    on_value:
      then:
        - lambda: |-
            id(remote_temperature_last_refresh) = millis();
            id(remote_temperature_override_active) = true;
            ESP_LOGI("remote_temp", "Remote temperature: %.2f C", x);
        - climate.mitsubishi_cn105.set_remote_temperature:
            id: hp
            temperature: !lambda 'return x;'

interval:
  # External Temp Sensor Query and missing-refresh fallback
  - interval: 30s
    then:
      # Replaces the external component's remote_temperature_timeout: 30min.
      # This does not care whether the value changed, only whether HA has
      # successfully refreshed it within the timeout window.
      - if:
          condition:
            lambda: |-
              return id(remote_temperature_override_active) &&
                     (millis() - id(remote_temperature_last_refresh)) >= 30UL * 60UL * 1000UL;
          then:
            - logger.log:
                level: WARN
                format: 'Remote temperature refresh timed out, clearing Mitsubishi CN105 override'
            - climate.mitsubishi_cn105.clear_remote_temperature:
                id: hp
            - lambda: |-
                id(remote_temperature_override_active) = false;
      - if:
          condition:
            lambda: |-
              const std::string &s = id(remote_temperature_entity).state;
              return !s.empty();
          then:
            - logger.log:
                level: DEBUG
                format: "Querying remote temperature sensor from HA: '%s'"
                args: ['id(remote_temperature_entity).state.c_str()']
            - homeassistant.action:
                action: script.get_sensor_value
                data:
                  entity_id: !lambda 'return id(remote_temperature_entity).state;'
                capture_response: true
                response_template: "{{ response['value'] }}"
                on_success:
                  - lambda: |-
                      float temp = response["response"].as<float>();
                      if (isnan(temp)) {
                        ESP_LOGW("remote_temp", "HA reply is not numeric, skipping update");
                        return;
                      }
                      // Publish to the template sensor so filters/logging are centralized.
                      id(remote_temperature).publish_state(temp);
                on_error:
                  - logger.log:
                      level: WARN
                      format: 'Failed to get remote temperature: %s'
                      args: ['error.c_str()']
          else:
            - logger.log:
                level: VERBOSE
                format: 'Remote temperature sensor entity ID is empty, skipping query'

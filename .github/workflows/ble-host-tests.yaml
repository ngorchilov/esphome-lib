name: BLE host tests

on:
  push:
    paths:
      - components/bk72xx_ble_server/**
      - .github/workflows/ble-host-tests.yaml
  pull_request:
    paths:
      - components/bk72xx_ble_server/**
      - .github/workflows/ble-host-tests.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ble-host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ESPHome
        run: python -m pip install esphome==2026.8.2
      - name: Run BLE host tests with sanitizers
        run: python components/bk72xx_ble_server/tests/test_recovery.py

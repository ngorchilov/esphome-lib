name: Configuration validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - esphome: 2026.10.0
            targets: --all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ESPHome
        run: python -m pip install esphome==${{ matrix.esphome }}
      - name: Test regression runner
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate configurations and models
        run: python tests/validate.py ${{ matrix.targets }}
      - name: Validate consumer documentation examples
        run: python tests/docs_config.py
      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-validation-${{ matrix.esphome }}
          path: |
            /tmp/esphome-lib-validation-*/results.json
            /tmp/esphome-lib-validation-*/logs/
            /tmp/esphome-lib-docs-*/results.json
            /tmp/esphome-lib-docs-*/logs/
          if-no-files-found: ignore

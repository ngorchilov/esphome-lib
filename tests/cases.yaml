# A known_failure must fail for its documented reason; unexpected success fails CI too.
cases:
  - id: esp32-switch
    file: tests/fixtures/relay.yaml
  - id: esp32-light
    file: tests/fixtures/relay.yaml
    substitutions: {role: light}
  - id: esp32-valve
    file: tests/fixtures/relay.yaml
    substitutions: {role: valve}
  - id: c3-switch
    file: tests/fixtures/relay.yaml
    substitutions: {board: esp32-c3-devkitm-1}
  - id: c3-light
    file: tests/fixtures/relay.yaml
    substitutions: {board: esp32-c3-devkitm-1, role: light}
  - id: c3-valve
    file: tests/fixtures/relay.yaml
    substitutions: {board: esp32-c3-devkitm-1, role: valve}
  - id: detached-light
    file: tests/fixtures/relay.yaml
    substitutions: {role: light, control_mode: detached}
  - id: no-control-light
    file: tests/fixtures/relay.yaml
    substitutions: {role: light, control_mode: none}
  - id: libretiny-multi
    file: tests/fixtures/relay-multi.yaml
  - id: kincony-roles
    file: tests/fixtures/kincony-roles.yaml
  - id: waveshare-roles
    file: tests/fixtures/waveshare-roles.yaml
  - id: fan-instances
    file: tests/fixtures/fan-instances.yaml

  # Exercise every own-repository external component without a second source override.
  - id: source-tuya-product
    file: devices/jummico-dehumidifier.yaml
    local_components: [tuya_product]
  - id: source-magic-switch
    file: devices/sonoff-basic-r4.yaml
    local_components: [magic_switch]
    contract: enabled-basic
  - id: source-ln882h-pwm
    file: devices/tuya-ceiling-light-wl2h.yaml
    local_components: [ln882h_pwm]
  - id: source-rtl8720c-evse
    file: devices/evse-feyree-three-phase.yaml
    local_components: [rtl8720c_uart]
  - id: source-rtl8720c-fan
    file: devices/fan-scheeair-nova-100.yaml
    local_components: [rtl8720c_uart]
  - id: source-ble
    file: tests/fixtures/garage-ble.yaml
    local_components: [bk72xx_ble_server]

  - id: disabled-basic
    file: tests/fixtures/disabled-basic.yaml
    contract: disabled-basic
  - id: disabled-basic-light
    file: tests/fixtures/disabled-basic.yaml
    substitutions: {role: light}
    contract: disabled-basic
  - id: disabled-basic-valve
    file: tests/fixtures/disabled-basic.yaml
    substitutions: {role: valve}
    contract: disabled-basic
  - id: enabled-basic-switch
    file: tests/fixtures/disabled-basic.yaml
    substitutions: {entity_enabled: true}
    contract: enabled-basic
  - id: enabled-basic-light
    file: tests/fixtures/disabled-basic.yaml
    substitutions: {entity_enabled: true, role: light}
    contract: enabled-basic
  - id: enabled-basic-valve
    file: tests/fixtures/disabled-basic.yaml
    substitutions: {entity_enabled: true, role: valve}
    contract: enabled-basic
  - id: disabled-2relay
    file: tests/fixtures/disabled-2relay.yaml
    contract: two-relay
  - id: disabled-second-relay
    file: tests/fixtures/disabled-2relay.yaml
    substitutions: {first_enabled: true, second_enabled: false}
    contract: two-relay
  - id: disabled-both-relays
    file: tests/fixtures/disabled-2relay.yaml
    substitutions: {first_enabled: false, second_enabled: false}
    contract: two-relay
  - id: both-relays
    file: tests/fixtures/disabled-2relay.yaml
    substitutions: {first_enabled: true, second_enabled: true}
    contract: two-relay
  - id: disabled-relay-light
    file: tests/fixtures/disabled-2relay.yaml
    substitutions: {role: light}
    contract: two-relay
  - id: disabled-relay-valve
    file: tests/fixtures/disabled-2relay.yaml
    substitutions: {role: valve}
    contract: two-relay
  - id: garage-no-ble-secret
    file: devices/tuya-garage-opener.yaml
    secrets: {wifi_ssid: test-network, wifi_password: test-password}
  - id: radio-frequency
    file: tests/fixtures/radio.yaml
    contract: radio-frequency
  - id: explicit-wifi-no-secrets
    file: tests/fixtures/explicit-wifi.yaml
    secrets: false
    contract: wifi-explicit
  - id: open-wifi-no-secrets
    file: tests/fixtures/wifi-open.yaml
    secrets: false
    contract: wifi-open
  - id: explicit-ssid-only
    file: tests/fixtures/wifi-partial.yaml
    secrets: {wifi_password: fallback-password}
    contract: wifi-ssid
  - id: explicit-password-only
    file: tests/fixtures/wifi-partial.yaml
    substitutions: {credential: password, value: explicit-password}
    secrets: {wifi_ssid: fallback-network}
    contract: wifi-password
  - id: ethernet-no-secrets
    file: tests/fixtures/ethernet-no-secrets.yaml
    secrets: false
  - id: earu-acquisition
    file: devices/earu-breaker.yaml
    contract: earu
  - id: inherited-logger
    file: devices/pro-breeze-dehumidifier.yaml
    substitutions: {log_level: WARN}
    contract: inherited-logger
  - id: serial-logger-esp07
    file: kickstart/kickstart-esp07.yaml
    contract: serial-logger-esp07
  - id: serial-logger-esp12ef
    file: kickstart/kickstart-esp12ef.yaml
    contract: serial-logger-esp12ef
  - id: serial-logger-melcutter-v2
    file: devices/melcutter-v2.yaml
    contract: serial-logger-esp07
  - id: serial-logger-water-meter
    file: devices/tuya-8-in-1-water-meter.yaml
    contract: serial-logger-beken
  - id: serial-logger-ct16
    file: devices/tuya-ct-clamp-16em-200a.yaml
    contract: serial-logger-beken
  - id: serial-logger-hri4853
    file: devices/heltec-hri-485x.yaml
    contract: serial-logger-hri4853
  - id: esp8266-pin
    file: tests/fixtures/relay.yaml
    substitutions: {board: esp07}
    known_failure: '[drive_strength] is an invalid option'
    reason: Phase 3 - ESP32-only keys in the shared pin wrapper.
  - id: offline
    file: tests/fixtures/offline.yaml
    known_failure: Component api requires component network
    reason: Phase 4 - base services require a network even in offline mode.

  # Deliberately invalid public API values must be rejected, not silently defaulted.
  - id: reject-entity-type
    file: tests/fixtures/relay.yaml
    substitutions: {role: unsupported}
    reject: invalid-unsupported.yaml
  - id: reject-control-mode
    file: tests/fixtures/relay.yaml
    substitutions: {control_mode: unsupported}
    reject: invalid-unsupported.yaml
  - id: reject-radio-profile
    file: tests/fixtures/radio.yaml
    substitutions: {profile: unsupported}
    reject: INVALID_RADIO_PROFILE_OR_DRIVER

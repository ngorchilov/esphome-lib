substitutions:
  name: test-networking-literal
packages:
  - !include
    file: ../../packages/boards/espressif/esp32dev.yaml
    vars:
      networking:
        interfaces: [ethernet, wifi]
        wifi:
          ssid: test-network
          password: test-password
        ethernet:
          type: W5500
          clk_pin: GPIO18
          mosi_pin: GPIO23
          miso_pin: GPIO19
          cs_pin: GPIO5
          cs_strapping: true
          interrupt_pin: GPIO35
          reset_pin: GPIO33

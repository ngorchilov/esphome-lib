# Schema-only combination with a hypothetical external W5500, not a board wiring guide.
substitutions:
  name: test-lcd-networking
  test_interfaces: [ethernet, wifi]
  test_ethernet_boot_option: false
packages:
  - !include
    file: ../../packages/appliances/waveshare-esp32-s3-touch-lcd-7b.yaml
    vars:
      waveshare_lcd7b:
        networking:
          interfaces: ${test_interfaces}
          wifi:
            ssid: test-network
            password: test-password
          ethernet: >-
            ${ dict({'type': 'W5500', 'clk_pin': 'GPIO11', 'mosi_pin': 'GPIO12',
                     'miso_pin': 'GPIO13', 'cs_pin': 'GPIO15', 'interrupt_pin': 'GPIO16',
                     'reset_pin': 'GPIO6'},
                    **({'enable_on_boot': false} if test_ethernet_boot_option | string | lower == 'true' else {})) }

substitutions:
  name: base-board-esphome-esp32
  friendly_name: Base Board ESPHome (ESP32)

packages:
  - !include base-board-esphome.yaml

esp32:
  framework:
    type: esp-idf

text_sensor:
  - id: !extend mcu_active_firmware_image
    internal: false
    lambda: |-
      const esp_partition_t *running = esp_ota_get_running_partition();
      if (running == nullptr) {
        return {"Unknown"};
      }

      size_t app_count = 0;
      uint32_t first_address = UINT32_MAX;
      uint32_t second_address = 0;
      esp_partition_iterator_t iterator =
          esp_partition_find(ESP_PARTITION_TYPE_APP, ESP_PARTITION_SUBTYPE_ANY, nullptr);
      while (iterator != nullptr) {
        const esp_partition_t *partition = esp_partition_get(iterator);
        app_count++;
        first_address = std::min(first_address, partition->address);
        second_address = std::max(second_address, partition->address);
        iterator = esp_partition_next(iterator);
      }
      esp_partition_iterator_release(iterator);

      if (app_count == 1) {
        return {"Single"};
      }
      if (app_count == 2 && running->address == first_address) {
        return {"First"};
      }
      if (app_count == 2 && running->address == second_address) {
        return {"Second"};
      }
      return {"Unknown"};

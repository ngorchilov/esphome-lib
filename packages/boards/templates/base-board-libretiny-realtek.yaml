substitutions:
  name: base-board-libretiny-realtek
  friendly_name: Base Board LibreTiny (Realtek)
  has_internal_temperature: false

packages:
  - !include base-board-libretiny.yaml

esphome:
  # RTL8720C modules may not boot after LibreTiny's CPU-only reset.
  platformio_options:
    build_flags:
      - -Wl,--wrap=lt_reboot
      - -Wl,--defsym=__wrap_lt_reboot=sys_reset

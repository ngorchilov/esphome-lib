substitutions:
  name: base-board-libretiny-realtek
  friendly_name: Base Board LibreTiny (Realtek)
  has_internal_temperature: false

packages:
  - !include base-board-libretiny.yaml

button:
  # RTL8720C modules may not boot after LibreTiny's CPU-only reset.
  - platform: template
    name: MCU Restart
    id: !extend mcu_restart
    entity_category: config
    device_class: restart
    on_press:
      - lambda: |-
          extern void realtek_system_reset(void) asm("sys_reset");
          realtek_system_reset();
          while (true) {}

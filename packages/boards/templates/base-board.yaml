defaults:
  base_networking_settings: !include ../../modules/networking/settings.yaml

substitutions:
  name: base-board
  friendly_name: Base Board

  log_level: INFO
  has_internal_temperature: true
  internal_temperature_module: !include ../../modules/internal-temperature.yaml

packages:
  - !include ../../modules/networking.yaml
  - ${ has_internal_temperature and internal_temperature_module or {} }

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

  # Requires conditional packages and reliable !include vars substitution in lambdas.
  min_version: ${ '2026.8.0' if base_networking_settings.requires_2026_8 else '2026.5.0' }

  on_boot:
    - priority: 500
      then:
        - component.update: mcu_active_firmware_image

logger:
  level: ${log_level}

button:
  - platform: restart
    name: MCU Restart
    id: mcu_restart

text_sensor:
  - platform: template
    name: Active Firmware Image
    id: mcu_active_firmware_image
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  - platform: version
    name: ESPhome Version
    id: mcu_version_esphome
    entity_category: diagnostic
    hide_timestamp: true
    disabled_by_default: true

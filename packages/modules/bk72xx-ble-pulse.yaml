# Optional three-byte BLE command input for a caller-owned command script.
defaults:
  ble_pulse: ${ ble_pulse | default({}) }
  # CLI substitutions arrive as strings; reject anything except true/false.
  _ble_pulse_enabled: ${ ble_pulse.get("enabled", false) | string | lower }

packages:
  - !include
    file: bk72xx-ble-pulse/enabled.yaml
    condition: ${_ble_pulse_enabled}

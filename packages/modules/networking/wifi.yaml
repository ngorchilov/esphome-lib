defaults:
  wifi_ap_enabled: ${ wifi_ap_enabled | default(false) }
  networking: ${ networking | default({}) }
  networking_wifi: ${ networking.get("wifi", {}) }
  _wifi_default_ssid: !secret wifi_ssid
  _wifi_default_password: !secret wifi_password
  wifi_ssid: ${ networking_wifi.get("ssid", _wifi_default_ssid) }
  wifi_password: ${ networking_wifi.get("password", _wifi_default_password) }

  _wifi_ap_module: !include wifi-ap.yaml

packages:
  - ${ wifi_ap_enabled and _wifi_ap_module or {} }

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    id: mcu_wifi_signal
    device_class: signal_strength
    unit_of_measurement: dBm
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - delta: 1

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP
      id: mcu_ip
      entity_category: diagnostic
      icon: mdi:ip-network
    ssid:
      name: SSID
      id: mcu_ssid
      entity_category: diagnostic
      disabled_by_default: true
    bssid:
      name: BSSID
      id: mcu_bssid
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: MAC Address
      id: mcu_mac_address
      entity_category: diagnostic
      disabled_by_default: true

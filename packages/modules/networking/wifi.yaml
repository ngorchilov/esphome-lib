defaults:
  networking: ${ networking | default({}) }
  networking_wifi: ${ networking.get("wifi", {}) }
  wifi_reboot_timeout: ${ networking_wifi.get("reboot_timeout", "0s") }

wifi:
  # Deferred includes avoid loading unused fallback secrets, including for open networks.
  ssid: !include
    file: wifi/${ 'explicit' if 'ssid' in networking_wifi else 'ssid' }.yaml
    vars:
      credential_value: ${ networking_wifi.get("ssid", "") }
  password: !include
    file: wifi/${ 'explicit' if 'password' in networking_wifi else 'password' }.yaml
    vars:
      credential_value: ${ networking_wifi.get("password", "") }
  reboot_timeout: ${wifi_reboot_timeout}

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    id: mcu_wifi_signal
    device_class: signal_strength
    unit_of_measurement: dBm
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    disabled_by_default: true
    filters:
      - delta: 1

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP
      id: mcu_ip
      entity_category: diagnostic
      icon: mdi:ip-network
    ssid:
      name: SSID
      id: mcu_ssid
      entity_category: diagnostic
      disabled_by_default: true
    bssid:
      name: BSSID
      id: mcu_bssid
      entity_category: diagnostic
      disabled_by_default: true
    mac_address:
      name: MAC Address
      id: mcu_mac_address
      entity_category: diagnostic
      disabled_by_default: true

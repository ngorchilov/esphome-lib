# Tuya product information from the MCU's startup PRODUCT_QUERY response.

defaults:
  tuya_product: ${ tuya_product | default({}) }
  tuya_product_uart_id: ${ tuya_product.get("uart_id", "tuya_uart") }
  tuya_product_id: ${ tuya_product.get("id", "tuya_product_info") }
  tuya_product_pid_name: ${ tuya_product.get("pid_name", "Tuya Product ID") }
  tuya_product_version_name: ${ tuya_product.get("version_name", "Tuya MCU Version") }

external_components:
  - source: github://ngorchilov/esphome-lib
    components: [tuya_product]
    refresh: 0s

text_sensor:
  - platform: tuya_product
    id: ${tuya_product_id}
    uart_id: ${tuya_product_uart_id}
    product_id:
      name: ${tuya_product_pid_name}
      id: ${tuya_product_id}_pid
      disabled_by_default: true
      icon: mdi:identifier
    mcu_version:
      name: ${tuya_product_version_name}
      id: ${tuya_product_id}_version
      disabled_by_default: true

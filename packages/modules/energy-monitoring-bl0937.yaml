# BL0937 Energy Monitoring Module
# Usage: Include this package in devices using the BL0937 chip for energy monitoring.

defaults:
  energy: ${ energy | default({}) }
  bl0937_cf_pin: ${ energy.get("cf_pin", "GPIO6") }
  bl0937_cf1_pin: ${ energy.get("cf1_pin", "GPIO8") }
  bl0937_sel_pin: ${ energy.get("sel_pin", "GPIO11") }
  bl0937_voltage_divider: ${ energy.get("voltage_divider", 775) }
  bl0937_current_resistor: ${ energy.get("current_resistor", "0.00104 ohm") }
  bl0937_current_multiply: ${ energy.get("current_multiply", 1) }
  bl0937_update_interval: ${ energy.get("update_interval", "30s") }

sensor:
  - platform: hlw8012
    id: energy_monitor
    model: BL0937
    cf_pin: !include
      file: pin.yaml
      vars:
        pin:
          number: ${bl0937_cf_pin}
          inverted: true
          mode:
            input: true
    cf1_pin: !include
      file: pin.yaml
      vars:
        pin:
          number: ${bl0937_cf1_pin}
          inverted: true
          mode:
            input: true
    sel_pin: !include
      file: pin.yaml
      vars:
        pin:
          number: ${bl0937_sel_pin}
          inverted: true
          mode:
            output: true
    current:
      name: Current
      id: current
      filters:
        - multiply: ${bl0937_current_multiply}
    voltage:
      name: Voltage
      id: voltage
    power:
      name: Power
      id: power
    energy:
      name: Energy
      id: energy
    voltage_divider: ${bl0937_voltage_divider}
    current_resistor: ${bl0937_current_resistor}
    update_interval: ${bl0937_update_interval}

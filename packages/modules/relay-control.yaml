# Relay Control (assembler)
# Public entrypoint. Composes core + selected control target + optional plugins.

defaults:
  rc: ${ rc | default({}) }
  rc_entity: ${ rc.get("entity", {}) }
  rc_power: ${ rc.get("power", {}) }
  rc_control: ${ rc.get("control", {}) }
  rc_indicator_led: ${ rc.get("indicator_led", {}) }
  rc_integrated_button: ${ rc.get("integrated_button", {}) }
  rc_external_switch: ${ rc.get("external_switch", {}) }
  rc_external_magic: ${ rc.get("external_magic", {}) }
  rc_power_cycle: ${ rc.get("power_cycle", {}) }

  valid_entity_types:
    switch: switch
    light: light
    valve: valve
  requested_entity_type: ${ rc_entity.get("type", "switch") }
  entity_type: ${ valid_entity_types.get(requested_entity_type, "invalid-" ~ requested_entity_type) }
  entity_enabled: ${ rc_entity.get("enabled", rc.get("default_enabled", true)) }
  entity_control: ${ rc_entity.get("control", {}) }
  entity_power: ${ rc_entity.get("power", {}) }
  power_provider: ${ rc_power.get("provider", "gpio") }

  # Control:
  # - local: external control toggles the local relay
  # - detached: external control toggles a HA entity (relay remains always controllable via Power switch)
  valid_control_modes:
    local: local
    detached: detached
    none: none
  requested_control_mode: ${ entity_control.get("mode", rc_control.get("mode", "local")) }
  control_mode: ${ valid_control_modes.get(requested_control_mode, "invalid-" ~ requested_control_mode) }

  # A local light can own the GPIO output directly. Valves, switches, detached
  # lights, and separately exposed power controls retain a stateful switch.
  power_exposed: ${ entity_power.get("exposed", entity_type == "switch") }
  relay_internal: ${ rc_power.get("internal", (rc_entity.get("internal", rc.get("default_internal", false)) if entity_type == "switch" else false) or not power_exposed) }
  direct_local_light: ${ entity_type == "light" and control_mode == "local" and not power_exposed and relay_internal }
  has_power_switch: ${ not direct_local_light }

  # Optional plugins
  has_indicator_led: ${ rc_indicator_led.get("enabled", false) }
  has_integrated_button: ${ rc_integrated_button.get("enabled", false) }
  has_external_switch_gpio: ${ rc_external_switch.get("enabled", false) }
  has_external_magic: ${ rc_external_magic.get("enabled", false) }
  has_power_cycle: ${ rc_power_cycle.get("enabled", false) }

packages:
  # GPIO is the default provider. External providers create the binary output
  # before including relay-control and pass only its id.
  - !include
    file: relay-control/power-output-gpio.yaml
    condition: ${ power_provider == "gpio" }
  - !include
    file: relay-control/core.yaml
    condition: ${entity_enabled}
  - !include
    file: relay-control/power-switch.yaml
    condition: ${ entity_enabled and has_power_switch }
  - !include
    file: relay-control/control-target/${control_mode}.yaml
    condition: ${entity_enabled}
  - !include
    file: relay-control/entity-type/${entity_type}.yaml
    condition: ${entity_enabled}
  - !include
    file: relay-control/indicator-led.yaml
    condition: ${ entity_enabled and has_indicator_led }
  - !include
    file: relay-control/input/integrated-button-gpio.yaml
    condition: ${ entity_enabled and has_integrated_button }
  - !include
    file: relay-control/input/external-gpio.yaml
    condition: ${ entity_enabled and has_external_switch_gpio }
  - !include
    file: relay-control/input/external-magic.yaml
    condition: ${ entity_enabled and has_external_magic }
  - !include
    file: relay-control/power-cycle.yaml
    condition: ${ entity_enabled and has_power_cycle }

# BL0942 Energy Monitoring Module
# Usage: Include this package in devices using the BL0942 chip for energy monitoring.

defaults:
  energy: ${ energy | default({}) }
  bl0942_tx_pin: ${ energy.get("tx_pin", "GPIO11") }
  bl0942_rx_pin: ${ energy.get("rx_pin", "GPIO10") }
  bl0942_baud_rate: ${ energy.get("baud_rate", 4800) }
  bl0942_update_interval: ${ energy.get("update_interval", "30s") }

uart:
  tx_pin: !include
    file: pin.yaml
    vars:
      pin:
        number: ${bl0942_tx_pin}
        mode:
          output: true
  rx_pin: !include
    file: pin.yaml
    vars:
      pin:
        number: ${bl0942_rx_pin}
        mode:
          input: true
  baud_rate: ${bl0942_baud_rate}

sensor:
  - platform: bl0942
    id: energy_monitor
    voltage:
      name: Voltage
      id: voltage
    current:
      name: Current
      id: current
    power:
      name: Power
      id: power
    energy:
      name: Energy
      id: energy
    frequency:
      name: Frequency
      id: frequency
    update_interval: ${bl0942_update_interval}

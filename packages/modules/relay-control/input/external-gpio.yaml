# Optional external mechanical switch input (GPIO)
# - ext_mode: momentary | rocker
# Always toggles CONTROL. momentary: toggle on press. rocker: toggle on any state change.

defaults:
  rc: ${ rc | default({}) }
  rc_external_switch: ${ rc.get("external_switch", {}) }

  rc_id: ${ rc.get("id", "rc1") }

  ext_name: ${ rc_external_switch.get("name", "External Switch") }
  ext_pin: ${ rc_external_switch.get("pin", "GPIO0") }
  ext_inverted: ${ rc_external_switch.get("inverted", false) }
  ext_strapping: ${ rc_external_switch.get("strapping", false) }
  ext_mode: ${ rc_external_switch.get("mode", "rocker") }

binary_sensor:
  - platform: gpio
    name: ${ext_name}
    id: ${rc_id}_external_switch
    pin: !include
      file: ../../pin.yaml
      vars:
        pin:
          number: ${ext_pin}
          inverted: ${ext_inverted}
          mode:
            input: true
            pullup: ${ext_inverted}
            pulldown: ${not ext_inverted}
          ignore_strapping_warning: ${ext_strapping}

    # Ignore the initial GPIO publication so it cannot override restored power state.
    on_state_change:
      - if:
          condition:
            lambda: |-
              if (!x_previous.has_value() || !x.has_value())
                return false;
              return std::string("${ext_mode}") == "rocker" || x.value();
          then:
            - script.execute: ${rc_id}_primary_toggle

# Stateful switch owner for a relay-control physical output.

defaults:
  rc: ${ rc | default({}) }
  rc_entity: ${ rc.get("entity", {}) }
  rc_power: ${ rc.get("power", {}) }
  entity_power: ${ rc_entity.get("power", {}) }

  rc_id: ${ rc.get("id", "rc1") }
  entity_type: ${ rc_entity.get("type", "switch") }
  entity_name: ${ "none" if rc_entity.get("name", "none") == "None" else rc_entity.get("name", "none") }
  entity_internal: ${ rc_entity.get("internal", false) }
  power_name: ${ entity_power.get("name", "Power") }
  power_exposed: ${ entity_power.get("exposed", entity_type == "switch") }
  power_output_id: ${ rc_power.get("output_id", rc_id ~ "_power_output") }
  relay_name: ${ entity_name if entity_type == "switch" else power_name }
  relay_internal: ${ rc_power.get("internal", (entity_internal if entity_type == "switch" else false) or not power_exposed) }
  relay_restore_mode: ${ entity_power.get("restore_mode", rc_power.get("restore_mode", "RESTORE_DEFAULT_OFF")) }

packages:
  - !include
    file: ../output-switch.yaml
    vars:
      output_switch:
        name: ${relay_name}
        id: ${rc_id}_power_relay
        internal: ${relay_internal}
        output_id: ${power_output_id}
        restore_mode: ${relay_restore_mode}

switch:
  - id: !extend ${rc_id}_power_relay
    on_turn_on:
      - script.execute: ${rc_id}_record_power_on
    on_turn_off:
      - script.execute: ${rc_id}_record_power_off

script:
  - id: !extend ${rc_id}_power_on
    then:
      - switch.turn_on: ${rc_id}_power_relay

  - id: !extend ${rc_id}_power_off
    then:
      - switch.turn_off: ${rc_id}_power_relay

  - id: !extend ${rc_id}_power_toggle
    then:
      - switch.toggle: ${rc_id}_power_relay

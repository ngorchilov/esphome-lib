# Relay Control (core)
# - The selected provider supplies the physical binary output.
# - A role-specific package owns restored state and extends the POWER scripts.
# - "Control" scripts are implemented by relay-control/control-target/*.yaml via !extend.
# - Optional features use POWER scripts and state hooks, independent of entity type.

defaults:
  rc: ${ rc | default({}) }

  rc_id: ${ rc.get("id", "rc1") }

esphome:
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            binary_sensor.is_on: ${rc_id}_power_state
          then:
            - script.execute: ${rc_id}_after_power_on
          else:
            - script.execute: ${rc_id}_after_power_off
      - script.execute: ${rc_id}_after_power_change

binary_sensor:
  - platform: template
    id: ${rc_id}_power_state
    internal: true
    publish_initial_state: true

script:
  # State hooks are extended by optional features and device-specific behavior.
  - id: ${rc_id}_after_power_on
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_after_power_off
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_after_power_change
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_record_power_on
    mode: single
    then:
      - binary_sensor.template.publish:
          id: ${rc_id}_power_state
          state: true
      - script.execute: ${rc_id}_after_power_on
      - script.execute: ${rc_id}_after_power_change

  - id: ${rc_id}_record_power_off
    mode: single
    then:
      - binary_sensor.template.publish:
          id: ${rc_id}_power_state
          state: false
      - script.execute: ${rc_id}_after_power_off
      - script.execute: ${rc_id}_after_power_change

  # The selected state owner extends these local POWER commands.
  - id: ${rc_id}_power_on
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_power_off
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_power_toggle
    mode: single
    then:
      - lambda: |-
          return;

  # Control (local relay OR HA entity, depending on control_mode)
  - id: ${rc_id}_control_on
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_control_off
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_control_toggle
    mode: single
    then:
      - lambda: |-
          return;

  # Primary entity control (switch, light, valve, or a future facade).
  - id: ${rc_id}_primary_on
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_primary_off
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_primary_toggle
    mode: single
    then:
      - lambda: |-
          return;

# Relay Control (core)
# - Power relay switch is ALWAYS present (safety / power-cycle).
# - "Control" scripts are implemented by relay-control/control-target/*.yaml via !extend.
# - Indicator LED (if present) hooks into ${rc_id}_after_power_change (via !extend).

defaults:
  rc: ${ rc | default({}) }
  rc_entity: ${ rc.get("entity", {}) }
  rc_power: ${ rc.get("power", {}) }
  entity_power: ${ rc_entity.get("power", {}) }

  rc_id: ${ rc.get("id", "rc1") }
  entity_type: ${ rc_entity.get("type", "switch") }
  entity_name: ${ "none" if rc_entity.get("name", "none") == "None" else rc_entity.get("name", "none") }
  power_name: ${ entity_power.get("name", "Power") }
  relay_name: ${ entity_name if entity_type == "switch" else power_name }
  power_exposed: ${ entity_power.get("exposed", entity_type == "switch") }

  relay_pin: ${ rc_power.get("pin", "GPIO0") }
  relay_inverted: ${ rc_power.get("inverted", false) }
  relay_strapping: ${ rc_power.get("strapping", false) }
  relay_restore_mode: ${ entity_power.get("restore_mode", rc_power.get("restore_mode", "RESTORE_DEFAULT_OFF")) }
  relay_internal: ${ rc_power.get("internal", not power_exposed) }

esphome:
  on_boot:
    priority: -100
    then:
      - script.execute: ${rc_id}_after_power_change

switch:
  - platform: gpio
    name: ${relay_name}
    id: ${rc_id}_power_relay
    internal: ${relay_internal}
    pin: !include
      file: ../pin.yaml
      vars:
        pin:
          number: ${relay_pin}
          inverted: ${relay_inverted}
          mode:
            output: true
          ignore_strapping_warning: ${relay_strapping}
    restore_mode: ${relay_restore_mode}
    on_turn_on:
      - script.execute: ${rc_id}_after_power_change
    on_turn_off:
      - script.execute: ${rc_id}_after_power_change

script:
  # Hook: extended by indicator-led.yaml (and possibly others).
  - id: ${rc_id}_after_power_change
    mode: single
    then:
      - lambda: |-
          return;

  # Power relay control (always local)
  - id: ${rc_id}_power_on
    mode: single
    then:
      - switch.turn_on: ${rc_id}_power_relay

  - id: ${rc_id}_power_off
    mode: single
    then:
      - switch.turn_off: ${rc_id}_power_relay

  - id: ${rc_id}_power_toggle
    mode: single
    then:
      - switch.toggle: ${rc_id}_power_relay

  # Control (local relay OR HA entity, depending on control_mode)
  - id: ${rc_id}_control_on
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_control_off
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_control_toggle
    mode: single
    then:
      - lambda: |-
          return;

  # Primary entity control (switch, light, valve, or a future facade).
  - id: ${rc_id}_primary_on
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_primary_off
    mode: single
    then:
      - lambda: |-
          return;

  - id: ${rc_id}_primary_toggle
    mode: single
    then:
      - lambda: |-
          return;

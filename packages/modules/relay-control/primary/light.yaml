# Primary light commands the facade, which delegates state changes to CONTROL.

defaults:
  rc: ${ rc | default({}) }
  rc_id: ${ rc.get("id", "rc1") }

script:
  - id: !extend ${rc_id}_primary_on
    then:
      - light.turn_on: ${rc_id}_control_light

  - id: !extend ${rc_id}_primary_off
    then:
      - light.turn_off: ${rc_id}_control_light

  - id: !extend ${rc_id}_primary_toggle
    then:
      - light.toggle: ${rc_id}_control_light

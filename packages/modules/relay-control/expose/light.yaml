# Optional "appliance" light facade
# Targets CONTROL (so detached mode behaves naturally in HA).

defaults:
  rc: ${ rc | default({}) }
  rc_primary: ${ rc.get("primary", {}) }
  rc_control: ${ rc.get("control", {}) }
  rc_light: ${ rc.get("light", {}) }

  rc_id: ${ rc.get("id", "rc1") }
  primary_type: ${ rc_primary.get("type", "switch") }
  control_mode: ${ rc_control.get("mode", "local") }
  rc_name: ${ rc_primary.get("name", rc.get("name", "none" if primary_type == "light" else "Relay")) }

  control_restore_mode: ${ rc_light.get("restore_mode", "RESTORE_DEFAULT_OFF") }
  expose_light_internal: ${ rc_light.get("internal", false) }

output:
  - platform: template
    id: ${rc_id}_control_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: |-
              return state;
          then:
            - script.execute: ${rc_id}_control_on
          else:
            - script.execute: ${rc_id}_control_off

light:
  - platform: binary
    name: ${rc_name}
    id: ${rc_id}_control_light
    output: ${rc_id}_control_output
    restore_mode: ${control_restore_mode}
    internal: ${expose_light_internal}

script:
  - id: !extend ${rc_id}_after_power_change
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${control_mode}") == "local";
          then:
            - if:
                condition:
                  switch.is_on: ${rc_id}_power_relay
                then:
                  - light.turn_on: ${rc_id}_control_light
                else:
                  - light.turn_off: ${rc_id}_control_light

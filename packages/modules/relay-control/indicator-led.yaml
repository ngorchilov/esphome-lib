# Optional indicator LED
# Always reflects POWER relay state for safety.

defaults:
  rc: ${ rc | default({}) }
  rc_indicator_led: ${ rc.get("indicator_led", {}) }

  rc_id: ${ rc.get("id", "rc1") }

  led_name: ${ rc_indicator_led.get("name", "Relay LED") }
  led_pin: ${ rc_indicator_led.get("pin", "GPIO0") }
  led_inverted: ${ rc_indicator_led.get("inverted", false) }
  led_strapping: ${ rc_indicator_led.get("strapping", false) }
  led_internal: ${ rc_indicator_led.get("internal", true) }

output:
  - platform: gpio
    id: ${rc_id}_indicator_output
    pin: !include
      file: ../pin.yaml
      vars:
        pin:
          number: ${led_pin}
          inverted: ${led_inverted}
          mode:
            output: true
          ignore_strapping_warning: ${led_strapping}

light:
  - platform: binary
    name: ${led_name}
    id: ${rc_id}_indicator_led
    output: ${rc_id}_indicator_output
    internal: ${led_internal}

script:
  - id: !extend ${rc_id}_after_power_change
    then:
      - if:
          condition:
            switch.is_on: ${rc_id}_power_relay
          then:
            - light.turn_on: ${rc_id}_indicator_led
          else:
            - light.turn_off: ${rc_id}_indicator_led

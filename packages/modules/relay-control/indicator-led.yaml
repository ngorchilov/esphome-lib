# Optional indicator LED
# Always reflects POWER relay state for safety.

defaults:
  rc_id: rc1
  rc_name: Relay

  led_pin: GPIO0
  led_inverted: false
  led_strapping: false
  led_internal: true

output:
  - platform: gpio
    id: ${rc_id}_indicator_output
    pin: !include
      file: ../pin.yaml
      vars:
        number: ${led_pin}
        inverted: ${led_inverted}
        output: true
        ignore_strapping_warning: ${led_strapping}

light:
  - platform: binary
    name: ${rc_name} Relay LED
    id: ${rc_id}_indicator_led
    output: ${rc_id}_indicator_output
    internal: ${led_internal}

script:
  - id: !extend ${rc_id}_after_power_change
    then:
      - if:
          condition:
            switch.is_on: ${rc_id}_power_relay
          then:
            - light.turn_on: ${rc_id}_indicator_led
          else:
            - light.turn_off: ${rc_id}_indicator_led

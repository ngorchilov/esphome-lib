defaults:
  rc: ${ rc | default({}) }
  rc_power_cycle: ${ rc.get("power_cycle", {}) }

  rc_id: ${ rc.get("id", "rc1") }
  power_cycle_name: ${ rc_power_cycle.get("name", "Power Cycle") }
  power_cycle_delay: ${ rc_power_cycle.get("delay", "3s") }

script:
  - id: ${rc_id}_power_cycle
    mode: restart
    then:
      - script.execute: ${rc_id}_power_off
      - delay: ${power_cycle_delay}
      - script.execute: ${rc_id}_power_on

button:
  - platform: template
    name: ${power_cycle_name}
    id: ${rc_id}_power_cycle_button
    on_press:
      - script.execute: ${rc_id}_power_cycle

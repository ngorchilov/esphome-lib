# Switch entity uses the POWER switch and delegates commands to CONTROL.

defaults:
  rc: ${ rc | default({}) }
  rc_id: ${ rc.get("id", "rc1") }

script:
  - id: !extend ${rc_id}_primary_on
    then:
      - script.execute: ${rc_id}_control_on

  - id: !extend ${rc_id}_primary_off
    then:
      - script.execute: ${rc_id}_control_off

  - id: !extend ${rc_id}_primary_toggle
    then:
      - script.execute: ${rc_id}_control_toggle

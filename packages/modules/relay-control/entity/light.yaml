# Binary light facade delegates state changes to CONTROL while a separate
# switch owns the physical POWER output.

defaults:
  rc: ${ rc | default({}) }
  rc_entity: ${ rc.get("entity", {}) }
  rc_power: ${ rc.get("power", {}) }
  rc_control: ${ rc.get("control", {}) }
  entity_control: ${ rc_entity.get("control", {}) }

  rc_id: ${ rc.get("id", "rc1") }
  default_entity_name: ${ rc.get("default_name", "none") }
  default_entity_id: ${ rc.get("default_entity_id", rc_id ~ "_control_light") }
  entity_name: ${ "none" if rc_entity.get("name", default_entity_name) == "None" else rc_entity.get("name", default_entity_name) }
  entity_id: ${ rc_entity.get("id", default_entity_id) }
  entity_internal: ${ rc_entity.get("internal", rc.get("default_internal", false)) }
  entity_disabled_by_default: ${ rc_entity.get("disabled_by_default", rc.get("default_disabled_by_default", false)) }
  entity_restore_mode: ${ rc_entity.get("restore_mode", rc_power.get("restore_mode", "RESTORE_DEFAULT_OFF")) }
  control_mode: ${ entity_control.get("mode", rc_control.get("mode", "local")) }

output:
  - platform: template
    id: ${rc_id}_control_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: |-
              return state;
          then:
            - script.execute: ${rc_id}_control_on
          else:
            - script.execute: ${rc_id}_control_off

light:
  - platform: binary
    name: ${entity_name}
    id: ${entity_id}
    internal: ${entity_internal}
    disabled_by_default: ${entity_disabled_by_default}
    output: ${rc_id}_control_output
    restore_mode: ${entity_restore_mode}

script:
  - id: !extend ${rc_id}_primary_on
    then:
      - light.turn_on: ${entity_id}

  - id: !extend ${rc_id}_primary_off
    then:
      - light.turn_off: ${entity_id}

  - id: !extend ${rc_id}_primary_toggle
    then:
      - light.toggle: ${entity_id}

  - id: !extend ${rc_id}_after_power_on
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${control_mode}") == "local";
          then:
            - light.turn_on: ${entity_id}

  - id: !extend ${rc_id}_after_power_off
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${control_mode}") == "local";
          then:
            - light.turn_off: ${entity_id}

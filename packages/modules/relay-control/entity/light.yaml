# Binary light entity delegates state changes to CONTROL.

defaults:
  rc: ${ rc | default({}) }
  rc_entity: ${ rc.get("entity", {}) }
  rc_control: ${ rc.get("control", {}) }
  entity_control: ${ rc_entity.get("control", {}) }

  rc_id: ${ rc.get("id", "rc1") }
  entity_name: ${ "none" if rc_entity.get("name", "none") == "None" else rc_entity.get("name", "none") }
  entity_internal: ${ rc_entity.get("internal", false) }
  entity_restore_mode: ${ rc_entity.get("restore_mode", "RESTORE_DEFAULT_OFF") }
  control_mode: ${ entity_control.get("mode", rc_control.get("mode", "local")) }

output:
  - platform: template
    id: ${rc_id}_control_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: |-
              return state;
          then:
            - script.execute: ${rc_id}_control_on
          else:
            - script.execute: ${rc_id}_control_off

light:
  - platform: binary
    name: ${entity_name}
    id: ${rc_id}_control_light
    internal: ${entity_internal}
    output: ${rc_id}_control_output
    restore_mode: ${entity_restore_mode}

script:
  - id: !extend ${rc_id}_primary_on
    then:
      - light.turn_on: ${rc_id}_control_light

  - id: !extend ${rc_id}_primary_off
    then:
      - light.turn_off: ${rc_id}_control_light

  - id: !extend ${rc_id}_primary_toggle
    then:
      - light.toggle: ${rc_id}_control_light

  - id: !extend ${rc_id}_after_power_change
    then:
      - if:
          condition:
            lambda: |-
              return std::string("${control_mode}") == "local";
          then:
            - if:
                condition:
                  switch.is_on: ${rc_id}_power_relay
                then:
                  - light.turn_on: ${rc_id}_control_light
                else:
                  - light.turn_off: ${rc_id}_control_light

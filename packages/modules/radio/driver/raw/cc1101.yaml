defaults:
  _radio_after_idle_actions:
    - cc1101.set_idle:
        id: radio_transceiver
  _radio_after_rx_actions:
    - cc1101.begin_rx:
        id: radio_transceiver

cc1101:
  - id: radio_transceiver
    spi_id: radio_spi
    cs_pin: ${radio_cs_pin}
    frequency: ${radio_frequency}
    modulation_type: ${ radio_raw_transceiver.get("modulation_type", "ASK/OOK") }
    packet_mode: ${ radio_raw_transceiver.get("packet_mode", false) }
    filter_bandwidth: ${ radio_raw_transceiver.get("filter_bandwidth", "203kHz") }
    symbol_rate: ${ radio_raw_transceiver.get("symbol_rate", 5000) }
    sync_mode: None
    output_power: ${ radio_raw_transceiver.get("output_power", 10) }

script:
  - id: radio_enter_tx
    mode: single
    then:
      - cc1101.begin_tx:
          id: radio_transceiver
  - id: radio_enter_rx
    mode: single
    then:
      - cc1101.begin_rx:
          id: radio_transceiver
  - id: radio_enter_idle
    mode: single
    then:
      - cc1101.set_idle:
          id: radio_transceiver
  - id: radio_after_transmit
    mode: single
    then: ${ _radio_after_rx_actions if radio_raw_after_transmit == 'rx' else _radio_after_idle_actions }

# Integrated OLED display capability

i2c:
  - id: radio_i2c
    sda: ${radio_i2c_sda_pin}
    scl:
      number: ${radio_i2c_scl_pin}
      ignore_strapping_warning: ${radio_i2c_scl_strapping}
    scan: true

font:
  - file: gfonts://Roboto Mono
    id: radio_oled_font
    size: 11
    glyphs: ' !"#$%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz{|}~'

display:
  - platform: ssd1306_i2c
    id: radio_display
    i2c_id: radio_i2c
    model: SSD1306_128X64
    update_interval: 1s

# LoRa radio capability

defaults:
  _lora_radio_sx127x_pkg: !include radio/sx127x.yaml
  _lora_radio_wmbus_pkg: !include radio/wmbus.yaml

packages:
  - ${ _lora_radio_wmbus_pkg if lora_radio_driver == 'wmbus' else _lora_radio_sx127x_pkg }

spi:
  - id: lora_spi
    clk_pin:
      number: GPIO5
      ignore_strapping_warning: true
    mosi_pin: GPIO27
    miso_pin: GPIO19

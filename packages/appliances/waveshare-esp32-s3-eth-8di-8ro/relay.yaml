defaults:
  relay: ${ relay | default({}) }
  relay_config: ${ relay.get("config", {}) }

switch:
  - platform: gpio
    name: ${ relay_config.get("name", relay.get("name")) }
    id: ${ relay.get("id") }
    internal: ${ relay_config.get("internal", false) }
    disabled_by_default: ${ relay_config.get("disabled_by_default", false) }
    pin:
      pca9554: waveshare_8di8ro_relay_expander
      number: ${ relay.get("number") }
      mode:
        output: true
      inverted: false
    restore_mode: ${ relay_config.get("restore_mode", "ALWAYS_OFF") }

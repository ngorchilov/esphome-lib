defaults:
  relay: ${ relay | default({}) }
  relay_config: ${ relay.get("config", {}) }
  relay_output_id: ${ relay_config.get("output_id", relay.get("output_id")) }
  relay_control_module: !include
    file: ../../modules/appliance-relay.yaml
    vars:
      appliance_relay:
        id: ${ relay.get("id") }
        output_id: ${ relay_output_id }
        name: ${ relay.get("name") }
        restore_mode: RESTORE_DEFAULT_OFF
        config: ${ relay_config }

packages:
  - ${ relay_control_module }

output:
  - platform: gpio
    id: ${ relay_output_id }
    pin:
      pcf8574: outputs
      number: ${ relay.get("number") }
      mode: OUTPUT
      inverted: true

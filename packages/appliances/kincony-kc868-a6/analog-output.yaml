defaults:
  output: ${ output | default({}) }
  output_config: ${ output.get("config", {}) }

output:
  - platform: esp32_dac
    id: ${ output.get("output_id") }
    pin: ${ output.get("pin") }

number:
  - platform: template
    name: ${ output_config.get("name", output.get("name")) }
    id: ${ output.get("id") }
    internal: ${ output_config.get("internal", false) }
    disabled_by_default: ${ output_config.get("disabled_by_default", false) }
    unit_of_measurement: V
    min_value: 0
    max_value: 10
    step: 0.1
    mode: box
    optimistic: true
    restore_value: ${ output_config.get("restore_value", true) }
    on_value:
      - output.set_level:
          id: ${ output.get("output_id") }
          level: !lambda 'return x / 10.0;'
